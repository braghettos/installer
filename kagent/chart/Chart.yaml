apiVersion: v2
name: krateo-installer-agent
description: >-
  Federated specialist agent for the Krateo PlatformOps installer. A kagent Agent that
  installs, configures and evolves the platform by editing the Installer CR, registered on
  the krateo-autopilot orchestrator via the extraAgents hook (the single entry point). Packaged
  as a Krateo composition; published to oci://ghcr.io/braghettos/krateo/krateo-installer-agent.
type: application
# Pinned literally (NOT CHART_VERSION): this agent chart shares the installer repo, whose git
# tag is the umbrella's version — so the agent versions independently. The installer references
# krateo-installer-agent at this version; bump it here when the agent changes.
version: 0.1.0
# appVersion + the SOURCE_REF in `sources` are STAMPED to the release tag by release-oci on every
# tag (appVersion := <tag>, s/SOURCE_REF/<tag>/), so the published agent advertises the exact
# installer release it ships with and its `sources` point at that released ref — which the agent
# reads at runtime via the github MCP (discovering its codebase + chart structurally, not from a
# baked snapshot). The literal below is the local/default; release-oci overwrites it on publish.
appVersion: CHART_VERSION
home: https://krateo.io
sources:
  # the installer codebase + this agent chart, pinned to the released ref on publish
  - https://github.com/braghettos/krateo-installer/tree/SOURCE_REF
