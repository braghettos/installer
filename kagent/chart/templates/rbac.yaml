{{- if .Values.rbac.create }}
# Narrow authority: the agent provisions/evolves the platform ONLY by editing the Installer CR.
# Bound to the agent's OWN ServiceAccount: kagent >=0.9 runs the tool call as the agent's identity,
# not the shared tool-server SA (see values rbac.serviceAccountName).
# Not cluster-admin — every change is an ordinary, apiserver-validated `kubectl patch`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: installer-driver
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: krateo-installer-agent
    app.kubernetes.io/part-of: krateo-installer
rules:
  - apiGroups: [composition.krateo.io]
    resources: [installers]
    verbs: [get, list, watch, patch]
  - apiGroups: [core.krateo.io]
    resources: [compositiondefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: installer-driver
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: krateo-installer-agent
    app.kubernetes.io/part-of: krateo-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: installer-driver
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rbac.serviceAccountName }}
    namespace: {{ .Values.namespace }}
{{- end }}
