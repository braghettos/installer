apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: krateo-installer-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: krateo-installer-agent
    app.kubernetes.io/part-of: krateo-installer
spec:
  description: >-
    Installs, configures and evolves the Krateo PlatformOps platform by editing the Installer
    CR. Subject-matter expert on the compose-of-compositions umbrella: how it self-bootstraps the
    composition engine (core-provider) and self-reconciles every component (authn, snowplow,
    frontend, portal, oasgen-provider, observability, agents) from one `helm install`, and tears
    the whole tree down cleanly via three ordered Helm hooks. Route here for install/evolve/diagnose.
  type: Declarative
  declarative:
    runtime: python
    modelConfig: {{ .Values.modelConfig.name }}
    promptTemplate:
      dataSources:
        - kind: ConfigMap
          name: installer-agent-prompts-{{ .Values.prompts.language }}
          alias: prompts
    systemMessage: |
      {{`{{include "prompts/installer_agent"}}`}}
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
{{- if .Values.hitlApproval }}
          requireApproval:
            - k8s_patch_resource
            - k8s_apply_manifest
{{- end }}
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_resource_yaml
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_get_available_api_resources
            - k8s_get_cluster_configuration
            - k8s_check_service_connectivity
            - k8s_patch_resource
            - k8s_label_resource
            - k8s_annotate_resource
            - k8s_apply_manifest
            - helm_list_releases
            - helm_get_release
            - helm_upgrade
            - helm_repo_add
            - helm_repo_update
    a2aConfig:
      skills:
        - id: provision-platform
          name: Provision & Evolve the Platform
          description: >-
            Install, configure and evolve Krateo by editing the Installer CR — enable features,
            override component specs (typed componentValues), set exposure and private-registry
            auth — provisioned by core-provider in dependency order.
          tags: [krateo, installer, provisioning, installer-cr]
          examples:
            - Install Krateo on this cluster.
            - Turn on the oasgen-provider feature.
            - Override the snowplow replica count without breaking exposure.
            - Pull the component charts from our private registry.
        - id: installer-architecture
          name: Installer Architecture
          description: >-
            Explain the compose-of-compositions umbrella — the two render modes (bootstrap vs
            composition), self-bootstrap via the post-install hook, the runtime-generated
            installers CRD, and the Pass A / Pass B self-reconcile gated on crdExists + depsReady.
          tags: [krateo, installer, architecture, self-bootstrap]
          examples:
            - How does one `helm install` bring up the whole platform?
            - What gates Pass B from emitting a component's Composition?
        - id: teardown-internals
          name: Teardown Internals
          description: >-
            Walk through the three teardown hooks, why finalizer-based cleanup needs live
            controllers, the reverse-dependency drain, and the runtime-orphan sweep.
          tags: [teardown, finalizers, helm-hooks]
          examples:
            - Why is teardown split across three hooks?
            - A reinstall crashloops core-provider with "convert GVK to GVR" — fix?
    deployment:
      resources:
{{- toYaml .Values.resources | nindent 8 }}
