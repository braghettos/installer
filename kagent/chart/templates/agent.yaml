apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: krateo-installer-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: krateo-installer-agent
    app.kubernetes.io/part-of: krateo-installer
spec:
  description: >-
    Installs, evolves, and diagnoses the Krateo PlatformOps platform by editing the one Installer CR
    (installers.composition.krateo.io) the CRD-safe get->apply way — toggling spec.features (coreProvider,
    coreAgents, portal, oasgenProvider, specialistAgents), typed spec.componentValues overrides (including
    agent modelConfig), spec.registryAuth and spec.exposure — and is the subject-matter expert on the
    braghettos/krateo-installer compose-of-compositions umbrella (bootstrap vs composition render modes,
    self-bootstrap post-install hook, Pass A/Pass B self-reconcile gated on crdExists+depsReady over the
    core-provider 1.0.x engine, and the three-hook teardown).
  type: Declarative
  declarative:
    runtime: python
    modelConfig: {{ .Values.modelConfig.name }}
    promptTemplate:
      dataSources:
        - kind: ConfigMap
          name: installer-agent-prompts-{{ .Values.prompts.language }}
          alias: prompts
    systemMessage: |
      {{`{{include "prompts/installer_agent"}}`}}
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
{{- if .Values.hitlApproval }}
          # HITL: mutating tools pause for human approval (kagent requireApproval)
          requireApproval:
            - k8s_patch_resource
            - k8s_apply_manifest
            - k8s_label_resource
            - k8s_annotate_resource
{{- end }}
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_resource_yaml
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_get_available_api_resources
            - k8s_get_cluster_configuration
            - k8s_check_service_connectivity
            - k8s_patch_resource
            - k8s_label_resource
            - k8s_annotate_resource
            - k8s_apply_manifest
            - helm_list_releases
            - helm_get_release
            - helm_upgrade
            - helm_repo_add
            - helm_repo_update
{{- if .Values.fetch.enabled }}
      # Tokenless doc grounding: GET the version-pinned raw docs/llms.txt URL (public, no auth/token).
      - type: McpServer
        mcpServer:
          name: {{ .Values.fetch.mcpServer }}
          kind: MCPServer
          apiGroup: kagent.dev
          toolNames:
            - fetch
{{- end }}
    a2aConfig:
      skills:
        - id: provision-evolve-platform
          name: Provision & Evolve the Platform
          description: >-
            Install and evolve Krateo by editing the one Installer CR (get->apply, never strategic-merge
            patch): toggle spec.features, apply typed componentValues/modelConfig overrides, set registryAuth
            and exposure — core-provider then provisions in dependency order.
          tags: [krateo, installer, installer-cr, provisioning, component-values]
          examples:
            - Install Krateo on this cluster.
            - Turn on the oasgenProvider feature.
            - Override the snowplow spec via componentValues without breaking exposure.
            - Point my installer agent at a dedicated modelConfig and pull charts from our private registry.
        - id: installer-architecture
          name: Installer Architecture & Self-Reconcile
          description: >-
            Explain the compose-of-compositions umbrella — bootstrap vs composition render modes, the
            self-bootstrap post-install hook Job, the runtime-generated installers CRD, and Pass A / Pass B
            self-reconcile gated on crdExists + depsReady over the core-provider 1.0.x engine.
          tags: [krateo, installer, architecture, self-bootstrap, core-provider]
          examples:
            - How does one helm install bring up the whole platform?
            - What gates Pass B from emitting a component's Composition?
            - Why does the install need core-provider 1.0.x and not 0.26.1?
        - id: teardown-diagnostics
          name: Teardown & Rollout Diagnostics
          description: >-
            Walk through the three teardown Helm hooks (ordered-teardown, bootstrap-teardown,
            post-delete-cleanup), finalizer-based cleanup requiring live controllers, and diagnose rollout
            stalls (which Pass-B gate is unmet) or teardown wedges (lingering finalizers / hook Jobs).
          tags: [teardown, finalizers, helm-hooks, diagnostics]
          examples:
            - Why is teardown split across three Helm hooks?
            - A reinstall crashloops core-provider with "convert GVK to GVR" — fix?
            - My portal Composition is stuck NotReady — which Pass-B gate is blocking it?
    deployment:
      resources:
{{- toYaml .Values.resources | nindent 8 }}
