{{- if .Values.modelConfig.create }}
# ModelConfig for the installer-agent. Defaults to GeminiVertexAI via Application Default
# Credentials (no API key) — matching the autopilot. Created here for the standalone "spawn only
# the agent" case; set modelConfig.create=false to instead reference an existing (e.g. the
# autopilot's) ModelConfig by modelConfig.name, or set provider/apiKeySecret to run a different
# model (Gemini/Anthropic/OpenAI) — same surface as the federated specialist agents.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: {{ .Values.modelConfig.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.modelConfig.name }}
    app.kubernetes.io/part-of: krateo-installer-agent
spec:
  provider: {{ .Values.modelConfig.provider }}
  model: {{ .Values.modelConfig.model }}
{{- if eq .Values.modelConfig.provider "GeminiVertexAI" }}
  geminiVertexAI:
    projectID: {{ .Values.modelConfig.vertexAI.projectID | quote }}
    location: {{ .Values.modelConfig.vertexAI.location | quote }}
{{- else if .Values.modelConfig.apiKeySecret }}
  apiKeySecret: {{ .Values.modelConfig.apiKeySecret }}
  apiKeySecretKey: {{ .Values.modelConfig.apiKeySecretKey }}
{{- end }}
{{- end }}
