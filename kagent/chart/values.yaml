namespace: krateo-system

# ModelConfig the agent uses. Per the agents standard (§8 C3/C4), REFERENCE the autopilot's
# canonical ModelConfig by name (gemini-pro for this heavy/reasoning agent) with create=false —
# autopilot is the modelOwner and always ships alongside. Flip create=true ONLY for the truly
# standalone "spawn only the agent, no autopilot" demo, in which case it self-creates gemini-pro
# under the same canonical name (so the reference resolves identically).
modelConfig:
  name: gemini-pro
  create: false
  provider: GeminiVertexAI          # GeminiVertexAI (ADC) | Gemini (API key) | Anthropic | OpenAI
  model: gemini-2.5-pro
  # GeminiVertexAI via Application Default Credentials (no API key). projectID/location are
  # wired by the installer from .Values.vertexAI when this ships as an installer component.
  vertexAI:
    projectID: ""
    location: us-central1
  apiKeySecret: ""                  # used when the provider needs a key (Gemini/Anthropic/OpenAI)
  apiKeySecretKey: ""

# Human-in-the-loop gate on the mutating tools (k8s_patch_resource, k8s_apply_manifest) the
# agent uses to edit the Installer CR. true = pause for approval (safe); false = autonomous.
hitlApproval: true

# Narrow RBAC: bind patch-on-installers (+ read compositiondefinitions) to the ServiceAccount the
# kagent tool-server runs as (that SA executes the agent's k8s_patch_resource calls). Not
# cluster-admin — the agent provisions only by editing one CR, validated by the apiserver.
rbac:
  create: true
  serviceAccountName: kagent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
