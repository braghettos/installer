# Chart-managed component version pins (the tested-together set). SOURCED VIA .Files.Get
# (inst.componentsYaml helper), NOT values.yaml, so they are CHART CONTENT immune to
# 'helm upgrade --reuse-values' — a chart bump always propagates its pins on upgrade.
# User config lives in values.yaml componentValues (deep-merged); do NOT put pins here that
# users should tune. Edit a version here to bump a component.
components:
  # NOTE: core-provider (the composition engine) is NOT here — it is installed as the
  # umbrella's bootstrap Helm subchart dependency (see `bootstrap` above / Chart.yaml),
  # so it comes up before any composition is reconciled. Everything below is a gated
  # composition driven by that engine.
  #
  # ---- platform CRDs: unforked dependency-wrappers over upstream krateoplatformops CRD
  #      charts (braghettos/krateo). CRDs ship in the upstream templates/ (helm-owned ->
  #      clean teardown); the wrapper only adds the values.schema.json core-provider needs. ----
  - name: authn-crd
    kind: KrateoAuthnCrd
    chart: krateo-authn-crd
    version: "0.22.19"
    tier: platform
    feature: portal
  - name: oasgen-provider-crd
    kind: KrateoOasgenProviderCrd
    chart: krateo-oasgen-provider-crd
    version: "0.9.7"
    tier: platform
    feature: oasgenProvider
  - name: frontend-crd
    kind: KrateoFrontendCrd
    chart: krateo-frontend-crd
    # 1.3.46: widget CRDs regenerated from frontend 1.3.84 (the reconciled trunk) — RESTORES the
    # Theme widget CRD (tenant brand overrides, issue #49; it had been pruned by the pre-Theme 1.3.82
    # crds) + the RBAC-era widget set. Multi-arch, nginx-alpine port 80. Lockstep with frontend 1.3.46.
    # 1.3.44: widget CRDs regenerated from frontend 1.3.82 (multi-arch, port 8080, RBAC) — no Theme.
    # 1.3.43: widget CRDs regenerated from frontend 1.3.81 schemas — Row items gain responsive
    # spans (xs/sm/md/lg/xl/xxl) + aligns all widget CRDs to the now-running 1.3.81 frontend.
    # 1.3.42: Listy gains widgetData.pagination {pageSize, position?} (UX-audit #21) —
    # MUST deploy before/with portal >= 1.5.70, whose grid CRs use the field.
    version: "1.3.47"
    tier: platform
    feature: portal
  - name: snowplow-crd
    kind: KrateoSnowplowCrd
    chart: krateo-snowplow-crd
    version: "1.0.69"
    tier: platform
    feature: portal

  # ---- platform apps (each depends on its dedicated CRD composition being Ready) ----
  - name: authn
    kind: KrateoAuthn
    chart: krateo-authn
    version: "0.22.19"
    deps:
      - authn-crd
    tier: platform
    feature: portal
    expose: true
    exposePort: 8082
    svcMatch: authn
    configKeys:
      - AUTHN_API_BASE_URL
  - name: snowplow
    kind: KrateoSnowplow
    chart: krateo-snowplow
    version: "1.0.85"
    deps:
      - snowplow-crd
      - authn
    tier: platform
    feature: portal
    expose: true
    exposePort: 8081
    svcMatch: snowplow
    configKeys:
      - SNOWPLOW_API_BASE_URL
    # Phase-1 nav-prewarm reads the frontend config-vars ConfigMap by name; the installer
    # injects this env with the name COMPUTED from the frontend (consumer) component.
    frontendConfigEnv: FRONTEND_CONFIG_CONFIGMAP
  - name: frontend
    kind: KrateoFrontend
    chart: krateo-frontend
    # 1.3.30: externalize the Autopilot portal-builder prompt to config.json
    # (AUTOPILOT_PORTAL_PROMPT / AUTOPILOT_PORTAL_HOUSE_RULES config keys, empty=baked default).
    # Ships image 1.3.50 (delegation cue: PORTAL BUILDER delegates widget-CR authoring to the
    # frontend specialist). Pairs with frontend-agent 1.3.30 + krateo-autopilot 0.1.43.
    # 1.3.46: ships app image 1.3.84 — the reconciled trunk: RBAC Menu (hides page entries the
    #   user's Role cannot GET) + tenant Theme widget + multi-arch (amd64+arm64). The frontend
    #   unified on nginx:1.30-alpine (bitnami's free images are being sunset), which listens on
    #   port 80 — so chart 1.3.46 uses containerPort=service.port again (both 80), verified at
    #   RUNTIME. Lockstep with frontend-crd 1.3.46 (widget CRDs incl. Theme). SUPERSEDES the 1.3.44
    #   pin (image 1.3.82, bitnami/nginx :8080), which no longer matches the trunk's port-80 image.
    # 1.3.30: ships image 1.3.50 (older; probes/listens on :80).
    # 1.3.48: ships app image 1.3.86 — #69/#72 four render quick-wins (breadcrumb leaf-only
    #   truncation, inert panel icon, secondary-subtitle 14px, small-table cellPaddingBlockSM:6).
    #   No widget-schema change → frontend-crd stays 1.3.47 (Theme CRD present). Supersedes 1.3.47
    #   (image 1.3.85).
    # 1.3.49: ships app image 1.3.87 — #72 §0.5 + #76 small-table padding REVERSED to looser
    #   (cellPaddingBlockSM 6→8, cellPaddingBlock 9→16) per the "too tight" reports, and #75 §0.2
    #   (WidgetPage.PAGE_SEARCH drops '/blueprints' — blueprints now render their own inline ?q=
    #   search Input in flex.blueprints-filterbar, so no duplicate frontend PageSearch box).
    #   No widget-schema change → frontend-crd stays 1.3.47. Supersedes 1.3.48 (image 1.3.86).
    version: "1.3.49"
    deps:
      - frontend-crd
      - authn
      - snowplow
    tier: platform
    feature: portal
    expose: true
    exposePort: 8080
    svcMatch: frontend
    consumer: true
  - name: portal
    kind: Portal
    # 1.5.65: UX-audit wave 1 — honest condition labels on the compositions list, workload-health
    # join on the detail page (red pill + synthesized Workload condition), Ask-Autopilot builder
    # CTAs, scope=all stat-card navigation, relative ages. 1.5.66: unified status-pill spec
    # (green=health-only, filled tags) + 100% Kubernetes-native vocabulary — NotReady/NotSynced/
    # Unhealthy/NotFound/ScaledToZero single tokens, verbatim True/False condition statuses,
    # verbatim pod phases/reasons (CrashLoopBackOff); non-K8s domains keep domain vocabulary.
    # 1.5.67: honest marketplace caption — the catalog is an unfiltered helm-index mirror,
    # not curated; subtitle/eyebrow no longer claim curation (UX-audit #9).
    # 1.5.68: one verb per operation (UX-audit #10) — Install=blueprint acquisition (now the
    # PRIMARY marketplace-tile button), Create=composition ("New composition"→"Create
    # composition"), Uninstall=blueprint removal (was Delete); Delete reserved for instances.
    # 1.5.69: /search page header (UX-audit #11) — eyebrow + H1 + dynamic subtitle echoing
    # the query + result count (same RA as the list, cannot disagree); also the LAST
    # keyExtras lint failure fixed (resource-detail-header) → lint green.
    # 1.5.70: UX-audit batch 2 — obs nav Buttons out of the filter-chip band (#15),
    # TroubleshootingReport phase Ready→Analyzed (#20, K8s Ready kept verbatim),
    # marketplace/blueprints/search grids paginated via Listy pagination (#21 — REQUIRES
    # frontend-crd >= 1.3.42 AND frontend image >= 1.3.76, else snowplow 400s the grids).
    # 1.5.72: UX round-2 page punch list (30 items) — dashboard/compositions alignment +
    # composition-incidents strip, observability Reconciliation/Telemetry tabs + resource
    # LineChart, incident-first detail restructure, per-alert detail page, builder
    # consistency + KOG PR listing, /api-builder path. No new widget fields (no frontend-crd
    # bump). Item #30 KOG-publish-as-PR pairs with frontend >= 1.3.77.
    # 1.5.73: unwedge the 1.5.72 reconcile (item-less obs-header-actions Flex when no console
    # URL + float nav order 12.5) — both CRD-invalid, escaped helm template (schema-blind).
    # 1.5.74: #19 relative incident meta (rel jq parses troubleshooter microsecond+offset ts)
    #         + #21 composition-kind analyzed-resource deep-links to /compositions (needs fe >= 1.3.78).
    # 1.5.75: hotfix — 1.5.74 broke the incident-detail RA (filter: > folded block + # comments
    #         commented out the whole jq); switched to filter: | (literal). Page was skeleton-only.
    # 1.5.76: RBAC tier split — page-root Flexes deploy into tiers.{common,tenant,admin} namespaces
    #         so the monolithic Menu renders PER-AUDIENCE (snowplow resolves each item AS THE USER;
    #         the >=1.3.81 frontend hides pages whose Role the user lacks). Additive: tiers default to
    #         "" = release namespace, so prior single-namespace installs render unchanged. Set
    #         componentValues.portal.tiers.admin (+ the krateo-portal-admin Role) per deployment to
    #         split admin pages from tenants. Lockstep with frontend 1.3.43 above.
    # 1.5.77: incident-detail polish — root-cause category+grounded moved from the Card footer
    #         (which right-aligns via .items flex-end) into the left-aligned body (UX-25); remediation
    #         steps stack their gated action under the step body instead of a horizontal
    #         space-between that stranded the button far right with an empty right half (UX-26).
    # 1.5.78: incident #69/#72 CR quick-wins (UX-27) — detail: drop redundant Back link, strip title
    #         emoji, remove duplicated alerts/<name> box, Phase→Analysis stage, drop category: prefix +
    #         de-dup grounding line, remediation buttons small→middle. list: drop Affected-resource +
    #         Evidence columns, bind INCIDENT column to the short alert name, hideWhenEmpty the Autopilot
    #         feed. Widget-CR-only (no frontend-crd bump).
    # 1.5.79: incident detail §1 4-panel restructure (#72 §1) — new Summary TL;DR panel (server-side
    #         .summary: what happened/why/how to fix) + merged Why panel (root cause + gaps + trace,
    #         one flat card); PLUS blueprint-formdef tenant self-service fix (#66) — jsonschema CM ns
    #         from .compdef.metadata.namespace + composition target ns from userAccessFilter $namespaces.
    #         Widget-CR-only (no frontend-crd bump).
    # 1.5.80: #68 — move the Compositions page (page-compositions flex + sidebar-nav ref) from the
    #         admin tier to the common tier (.Release.Namespace) so namespace-scoped tenants see the
    #         Compositions menu item + their own Krateos (compositions-table is server-side tenant-scoped).
    #         No-op on non-tiered benches (already resolved to the release ns). Widget-CR-only.
    # 1.5.81: #70 — compositions-list discovers composition TYPES from the tenant blueprint namespace
    #         too (crdsBlueprints step, ns .Values.blueprintNamespace default krateo-blueprints; merged +
    #         uid-deduped), so a namespace-scoped tenant's own composition (blueprint in krateo-blueprints
    #         per acmp#53) lists. Namespaced/user-token (no ClusterRole); continueOnError → no-op where
    #         the ns is absent (non-tenant benches). Widget-CR-only.
    # 1.5.82: #72 — composition DETAIL page tenant-safe type discovery. composition-detail/-resources/
    #         -events discover the composition type via a cluster-wide compositiondefinitions list under
    #         a userAccessFilter (SA lists, refilter to CDs the caller can list) instead of a caller-token
    #         cluster-wide customresourcedefinitions list (403 → blank). -resources/-events `found` also
    #         namespace-scoped. MIGRATES #70 compositions-list to the same UAF pattern (covers all tenant-
    #         readable ns, not just 2 fixed). composition-editdef (Edit form) deferred (needs CM schema).
    #         Widget-CR-only. No-op on non-tenant benches (admin lists CDs everywhere → unchanged).
    # 1.5.83: #74 — composition-editdef (tenant Edit form) reads the form schema from the per-version
    #         jsonschema ConfigMap in the CD's namespace (namespaced, tenant-readable — like the #66
    #         create form), NOT the cluster-scoped CRD openAPIV3Schema a tenant can't GET. crds→UAF CD
    #         list, found→namespace-scoped. Completes the tenant self-service arc (#66/#68/#70/#72/#74).
    #         Widget-CR-only. No-op on non-tenant benches.
    # 1.5.84: frontend-issue render batch — #69 §0.4 (incident detail: lifecycle+trigger chips move
    #         onto the title line via flex.incident-detail-titleline), #72 §0.7 (Autopilot
    #         troubleshooting card = obs-troubleshooting Table + "Investigate with Autopilot" CTA,
    #         retiring the list feed), and #75 §0.2 (blueprints category chips + ?q= search Input on
    #         one line via flex.blueprints-filterbar). Widget-CR-only; pairs with frontend 1.3.49.
    version: "1.5.84"
    deps:
      - frontend
    tier: platform
    feature: portal
  # The helm-render dry-run service behind blueprint-preview + upgrade-impact (POST /render,
  # /diff). ClusterIP-only (never browser-exposed); snowplow reaches it in-cluster via the
  # chart-provisioned `helm-render-endpoint` Secret. A Krateo COMPOSITION component (NOT a
  # hand `helm install`) — the CDC names its release after the component (`krateo-helm-render-service`),
  # so the Service DNS `krateo-helm-render-service.krateo-system.svc:8080` the RAs use is preserved.
  - name: krateo-helm-render-service
    kind: KrateoHelmRenderService
    # 0.1.7: multi-arch image (linux/amd64 + linux/arm64). 0.1.6 was amd64-only, so it
    # ImagePullBackOff'd on arm64 clusters (Apple-silicon kind/dev); functionally identical.
    version: "0.1.7"
    tier: platform
    feature: portal
  - name: oasgen-provider
    kind: KrateoOasgenProvider
    chart: krateo-oasgen-provider
    version: "0.9.8"
    deps:
      - oasgen-provider-crd
    tier: platform
    feature: oasgenProvider
  # The KOG git-write provider: RepoContent/GitRef/PullRequest as github.krateo.io kinds —
  # the in-cluster git transport for portal blueprint authoring (and the KOG builder live
  # path). Ships only RestDefinitions + trimmed OpenAPI ConfigMaps; oasgen-provider generates
  # the CRDs and auto-deploys a rest-dynamic-controller per kind (no provider image). Chart
  # name = component name, so no `chart:` override (like krateo-helm-render-service above).
  - name: krateo-github-provider-kog
    kind: KrateoGithubProviderKog
    version: "0.1.10"
    deps:
      - oasgen-provider
    tier: platform
    feature: portal
  # API-Builder registry: braghettos/krateo-oas is itself a Helm chart whose templates glob the
  # merged apis/**/restdefinition.yaml + configmaps/**-oas.yaml and emit them verbatim. CDC renders
  # this singleton composition, so merged API-Builder artifacts become live RestDefinitions + OAS
  # ConfigMaps — owned, drift-healed, and PRUNED natively (no bespoke controller, no in-cluster poll;
  # this replaces the retired krateo-oas-gitops image). oasgen-provider then generates the CRD +
  # controller per RestDefinition. The human PR merge is the hard gate; on merge, krateo-oas's CI
  # re-tags the chart and this pin is bumped (git commit, no kubectl apply). Chart name = component
  # name, so no `chart:` override.
  - name: krateo-oas
    kind: KrateoOas
    version: "0.1.0"
    deps:
      - oasgen-provider
    tier: platform
    feature: oasgenProvider

  # ---- observability backend ----
  # ClickStack (ClickHouse + OTel gateway + HyperDX + MongoDB) is now a composition
  # (krateo-clickstack), replacing obs-stack install.sh. It also emits the ClickHouse
  # http-handlers ConfigMap, the otel-clickhouse-credentials Secret, and a HyperDX
  # LoadBalancer Service. Everything runs in namespaces.krateo (no clickhouse-system
  # split), so the collectors read the credentials Secret directly — no replica needed.
  # Observability data-layer OPERATORS — composition wrappers over the upstream ClickHouse +
  # MongoDB operators (braghettos/krateo-clickstack-operators-chart). They are no longer
  # bootstrap subcharts: as `observability`-gated components they install with the feature, so
  # enabling observability at runtime brings the operators up FIRST (krateo-clickstack depends
  # on them) — then the data layer, then the stack. CRDs ship templated, so core-provider
  # applies them on render and teardown is clean.
  - name: clickhouse-operator
    kind: ClickhouseOperator
    version: "0.1.0"
    tier: observability
    feature: portal
  - name: mongodb-operator
    kind: MongodbOperator
    version: "0.1.0"
    tier: observability
    feature: portal
  - name: krateo-observability
    kind: KrateoObservability
    # 0.1.9: durable ClickHouse retention — 15Gi data volume + 3d system-log TTLs via
    # settings.extraConfig (the 10Gi/no-TTL volume filled in 8 days → insert 243 →
    # OTel OOM loops → telemetry dead; live bench was PVC-expanded + ALTERed 2026-07-22).
    version: "0.1.9"
    tier: observability
    feature: portal
    # Operators first: the clickhouse.com + mongodbcommunity CRDs must be served and the
    # controllers running before clickstack creates its ClickHouseCluster/KeeperCluster/
    # MongoDBCommunity CRs (Pass B depsReady gate). This also makes teardown drain clickstack
    # (and its data-layer CRs) BEFORE the operators, so finalizers clear.
    deps:
      - clickhouse-operator
      - mongodb-operator
  # otel-collector-* and krateo-sse-proxy live in the krateo-clickstack-chart repo
  # (grouped with the clickstack chart) and publish to the consolidated registry
  # ociRepo = oci://ghcr.io/braghettos/krateo, like every other component.
  - name: otel-collector-deployment
    kind: OtelCollectorDeployment
    # 0.3.3: clickhouse exporter ttl 168h (fresh installs create 7d-TTL otel tables).
    version: "0.3.3"
    deps:
      - krateo-observability
    tier: observability
    feature: portal
  - name: otel-collector-daemonset
    kind: OtelCollectorDaemonset
    # 0.1.5: clickhouse exporter ttl 168h (fresh installs create 7d-TTL otel tables).
    version: "0.1.5"
    deps:
      - otel-collector-deployment
    tier: observability
    feature: portal
  - name: krateo-sse-proxy
    kind: KrateoSseProxy
    version: "0.1.6"
    deps:
      - krateo-observability
    tier: observability
    feature: portal
    expose: true
    exposePort: 8080
    svcMatch: sse-proxy
    configKeys:
      - EVENTS_API_BASE_URL
      - EVENTS_PUSH_API_BASE_URL

  # ---- agents (kagent / kmcp-managed tools) ----
  # kagent operator is referenced upstream (pinned >= v0.6.3); see templates/_notes.
  # clickhouse-mcp-server gives the observability agent read access to telemetry; the
  # autopilot is wired for Vertex AI ADC (vertexAI: true -> compositions.yaml injects the
  # vertexAI spec block from .Values.vertexAI).
  - name: clickhouse-mcp-server
    kind: ClickhouseMcpServer
    version: "0.1.7"
    deps:
      - krateo-observability
    tier: observability
    feature: specialistAgents
  # kagent agentic platform as two compositions (wrapping unforked upstream charts):
  #   kagent-crds installs the kagent.dev/kmcp CRDs (helm-templates/-owned -> clean teardown);
  #   kagent (the operator) depends on it, so the CRDs are established before its CRs render.
  - name: kagent-crds
    kind: KagentCrds
    version: "0.1.3"
    tier: observability
    feature: coreAgents
  - name: kagent
    kind: Kagent
    version: "0.1.7"
    deps:
      - kagent-crds
    tier: observability
    feature: coreAgents
    # Expose the kagent UI through the installer's exposure layer (exposure.type), leaving the
    # kagent chart's ui.service default ClusterIP. kagent's Service is nested at
    # kagentapp.ui.service (not the chart top-level `service`), so serviceValuesPath targets it.
    # Safe over plain HTTP as of kagent >= 0.9.7 (PR #1868: crypto.randomUUID feature-detect +
    # uuidv4 fallback) — no TLS needed; only navigator.clipboard copy buttons degrade.
    expose: true
    exposePort: 8080
    svcMatch: kagent-ui
    serviceValuesPath: kagentapp.ui.service
  # The installer's federated specialist agent (shipped from this repo's kagent/chart/), published
  # to /krateo/krateo-installer-agent and registered on the autopilot orchestrator via
  # componentValues.krateo-autopilot.extraAgents (below). It provisions/evolves the platform by
  # editing the Installer CR — narrow RBAC, see kagent/AGENT-DRIVEN-PROVISIONING.md.
  # Tokenless HTTP fetch MCP (mcp/fetch via kmcp): GETs public raw.githubusercontent.com doc URLs ->
  # markdown, so every agent reads its version-pinned docs/llms.txt with no token. Wired into agents
  # as the `fetch` tool (kind MCPServer). coreAgents-gated (base agent layer needs it too).
  - name: fetch-mcp-server
    kind: FetchMcpServer
    version: "0.1.1"
    deps:
      - kagent
    tier: observability
    feature: coreAgents
  - name: krateo-installer-agent
    kind: KrateoInstallerAgent
    # 0.2.306: A2A agent-card (description + skills) rewritten accurate to the installer's real domain
    # (Installer-CR get->apply, features/componentValues, self-reconcile/teardown). Chart in THIS repo.
    version: "0.2.306"
    deps:
      - kagent
    tier: observability
    feature: coreAgents
    vertexAI: true
  # Federated specialist agents — each ships from its component's *-chart repo (kagent/chart),
  # registered on the autopilot via componentValues.krateo-autopilot.extraAgents.
  - name: authn-agent
    kind: KrateoAuthnAgent
    chart: krateo-authn-agent
    # 0.22.22: A2A agent-card rewritten accurate — names the four real auth CRDs (User/LDAPConfig/
    # OIDCConfig/OAuthConfig) + apiGroups; split into manage + explain skills.
    version: "0.22.22"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: snowplow-agent
    kind: KrateoSnowplowAgent
    chart: krateo-snowplow-agent
    # 1.0.78: A2A agent-card rewritten accurate — real RESTAction fields (endpointRef/dependsOn/
    # exportJwt) + real /call content types + diagnostics. (gemini-pro authoring specialist.)
    version: "1.0.82"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: frontend-agent
    kind: KrateoFrontendAgent
    chart: krateo-frontend-agent
    # GRANULAR kagent HITL: gate exactly these tools. EMPTY for the frontend-agent — its only
    # mutating-shaped tool, k8s_apply_manifest, is a NON-mutating server DRY-RUN validator, so gating it
    # only stalled the authoring loop with a click per widget. The real human write gate stays downstream
    # at publishPage (blast-radius confirm). Every OTHER agent omits this key and inherits the coarse
    # global hitlApproval on its own mutating tools. (compositions.yaml threads requireApproval per-agent.)
    requireApproval: []
    # 1.3.34: granular requireApproval (list) replaces the hitlApproval boolean; default [] (dry-run
    # validator, nothing gated) + single-pass authoring + reuse compositions-list RA (1.3.30 = gemini-pro).
    version: "1.3.41"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: clickstack-agent
    kind: KrateoClickstackAgent
    chart: krateo-clickstack-agent
    # 3.0.31: A2A agent-card rewritten accurate — names the real ClickHouse OTel tables; asserts
    # read-only; split into troubleshoot + correlate skills. (Model stays flash; appVersion=
    # CHART_VERSION, no braghettos app image — third-party stack.)
    version: "3.0.31"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: core-provider-agent
    kind: KrateoCoreProviderAgent
    chart: krateo-core-provider-agent
    # 0.53.13: A2A agent-card rewritten accurate — names CompositionDefinition/Composition/
    # KubernetesTarget + values.schema.json authoring; 2 skills. (gemini-pro authoring specialist.)
    version: "0.53.13"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: krateo-autopilot
    kind: KrateoAutopilot
    # 0.1.48: default the shared flash + pro ModelConfigs to gemini-3.6-flash (current GA workhorse,
    # now callable on Vertex; the `pro` alias is kept so a 3.5-pro tier is a one-line restore).
    # Live-validated on installer-test (k8s-agent + autopilot orchestration ran on 3.6-flash, clean).
    # 0.1.44: routing determinism — classify a page-build request by the ACTION, not the page's
    # subject, so "build a Cluster Health page" goes to krateo-frontend-agent (authoring), not the
    # clickstack telemetry agent. (0.1.43: DOMAIN OWNERSHIP hard-rule — delegate domain authoring to
    # the owning specialist: portal page -> frontend-agent, RESTAction -> snowplow, blueprint -> helm.)
    version: "0.1.48"
    deps:
      - kagent
    tier: observability
    feature: coreAgents
    vertexAI: true
    # The autopilot owns the shared gemini-flash/gemini-pro ModelConfigs the whole fleet
    # references; with localModel.enabled it renders them as Ollama (the others just point here).
    modelOwner: true