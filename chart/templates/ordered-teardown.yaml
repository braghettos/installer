{{- /*
  ORDERED TEARDOWN — enforce "delete the component compositions (Pass B) BEFORE their
  CompositionDefinitions (Pass A)" via a helm pre-delete hook.

  Why: the Installer composition's helm release holds BOTH Pass A (CompositionDefinitions)
  and Pass B (compositions). On uninstall, helm cannot order two custom-CR kinds, so a
  component's CompositionDefinition can be deleted (-> core-provider removes that component's
  cdc) WHILE its composition is still being helm-uninstalled by that cdc -> the cdc dies
  mid-uninstall -> the release wedges in "uninstalling" and its helm-owned resources (e.g. the
  portal's demo-system namespace + cluster-roles) leak.

  This pre-delete hook deletes every component composition (composition.krateo.io/*) and WAITS
  for it to finalize, while Pass A + all the cdcs are still alive — so each cdc completes its
  helm-uninstall cleanly (demo-system etc. deleted). helm then deletes the CompositionDefinitions
  and core-provider GCs the generated CRDs. Composition mode only; runs only on `helm uninstall`
  of the Installer composition's release (pre-delete hooks don't fire on upgrade/reconcile).
  Best-effort (set +e / exit 0) so it never blocks the uninstall.
*/}}
{{- if not .Values.bootstrap.coreProvider.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: installer-ordered-teardown
  namespace: {{ .Values.namespaces.krateo }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: installer-ordered-teardown
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["composition.krateo.io"]
    resources: ["*"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: installer-ordered-teardown
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: installer-ordered-teardown
subjects:
  - kind: ServiceAccount
    name: installer-ordered-teardown
    namespace: {{ .Values.namespaces.krateo }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: installer-ordered-teardown
  namespace: {{ .Values.namespaces.krateo }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    spec:
      serviceAccountName: installer-ordered-teardown
      restartPolicy: Never
      containers:
        - name: order
          image: alpine/k8s:1.31.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set +e
              NS={{ .Values.namespaces.krateo }}
              echo "pre-delete: deleting component compositions (Pass B) and waiting, while their CompositionDefinitions + cdcs are still alive"
              for k in $(kubectl get crd 2>/dev/null | grep 'composition.krateo.io' | grep -v '^installers' | awk '{print $1}'); do
                n=$(kubectl get "$k" -n $NS --no-headers 2>/dev/null | wc -l | tr -d ' ')
                [ "$n" = "0" ] && continue
                echo "  deleting $k ($n) --wait (cdc helm-uninstalls it cleanly -> its helm-owned resources, e.g. demo-system, are deleted)"
                kubectl delete "$k" --all -n $NS --wait=true --timeout=90s
              done
              echo "pre-delete done — helm now deletes the CompositionDefinitions; core-provider GCs the generated CRDs"
              exit 0
{{- end }}
