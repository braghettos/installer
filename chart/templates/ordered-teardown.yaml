{{- /*
  ORDERED TEARDOWN (pre-delete Job hook). Fixes the reverse-dependency teardown wedge: the
  app compositions (portal, frontend, …) embed CRs of kinds provided by the *-crd compositions
  (portal's widget/User/RESTAction CRs <- frontend-crd/authn-crd/snowplow-crd). If the cascade
  deletes a *-crd composition (-> its CRDs) before the app finishes uninstalling, helm can't
  delete the orphaned CRs -> "failed to delete release" -> the release wedges and its helm-owned
  resources (e.g. the portal's demo-system namespace + devs-* cluster-roles) leak.

  This pre-delete hook (composition mode only; runs on `helm uninstall` of the Installer
  composition's release) deletes the APP compositions (every composition.krateo.io kind whose
  CRD does NOT end in `crds` — i.e. the consumers, not the CRD providers) CONCURRENTLY and waits
  for them to drain, WHILE the *-crd CompositionDefinitions/CRDs + their cdcs are still alive. So
  each app uninstalls cleanly (its CRs' CRDs present) -> demo-system etc. auto-delete. helm then
  deletes the CompositionDefinitions and core-provider GCs the *-crd CRDs (the app CRs are gone,
  no orphans). Concurrent + bounded so it finishes inside the cdc's helm-uninstall timeout.

  Runs as the cdc's own SA (installers-v<ver>); self-bootstrap grants it jobs + composition.* .
  Best-effort (set +e / exit 0) so it never blocks the uninstall.
*/}}
{{- if not .Values.bootstrap.coreProvider.enabled }}
{{- $cdcSA := printf "installers-v%s" (.Chart.Version | toString | replace "." "-") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: installer-ordered-teardown
  namespace: {{ .Values.namespaces.krateo }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    spec:
      serviceAccountName: {{ $cdcSA }}
      restartPolicy: Never
      containers:
        - name: order
          image: alpine/k8s:1.31.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set +e
              NS={{ .Values.namespaces.krateo }}
              # APP composition kinds = composition.krateo.io CRDs that DON'T end in 'crds'
              # (those are the CRD-provider compositions) and aren't the Installer itself.
              apps=$(kubectl get crd 2>/dev/null | grep 'composition.krateo.io' | grep -vE 'crds\.composition\.krateo\.io|^installers' | awk '{print $1}')
              echo "pre-delete: deleting APP compositions (consumers) concurrently, waiting, while the *-crd CRDs + cdcs are still alive"
              for k in $apps; do kubectl delete "$k" --all -n $NS --wait=false 2>/dev/null; done
              for i in $(seq 1 36); do
                left=0
                for k in $apps; do left=$((left + $(kubectl get "$k" -n $NS --no-headers 2>/dev/null | wc -l | tr -d ' '))); done
                [ "$left" = "0" ] && { echo "all app compositions uninstalled cleanly"; break; }
                echo "  ...$left app compositions still uninstalling"
                sleep 5
              done
              echo "pre-delete done — helm now deletes the CompositionDefinitions; core-provider GCs the *-crd CRDs (app CRs already gone, no orphans)"
              exit 0
{{- end }}
