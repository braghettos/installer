{{/*
  krateo-repo-mcp-server (shipped by the krateo-autopilot chart, same namespace) mounts this
  ConfigMap and uses it for two things: to answer "what version of X does this cluster run"
  and to resolve each component's `source.repo` at the pinned version.
*/}}
{{- if not .Values.bootstrap.coreProvider.enabled }}
{{- $platform := (.Files.Get "files/component-pins.yaml" | fromYaml).platform | default list }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: krateo-component-pins
  namespace: {{ .Values.namespaces.krateo }}
  labels:
    app.kubernetes.io/part-of: krateo
data:
  component-pins.yaml: |
    # GENERATED by the krateo-installer chart — do not edit in the cluster.
    # Effective component pins (chart file + any Installer CR version override).
{{ include "inst.componentsYaml" $ | indent 4 }}
{{- if $platform }}
{{ dict "platform" $platform | toYaml | replace "CHART_VERSION" (.Chart.Version | quote) | indent 4 }}
{{- end }}
{{- end }}
