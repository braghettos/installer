{{- /*
  HOOK 2 — drain-the-whole-footprint before controller removal (bootstrap-release pre-delete).

  Problem: on `helm uninstall installer` (symmetric teardown of the ONE bootstrap install),
  helm deletes EVERY resource in the bootstrap release in one pass — and core-provider lives
  in that release. If helm removes core-provider while ANY krateo object it finalizes still
  exists, that object's finalizer can never clear: the `installer` CompositionDefinition
  sticks Terminating (still-exist-compositions-finalizer), the per-composition cdc Deployment
  (installers-v<ver>-controller, created by core-provider at runtime -> NOT helm-owned) is
  orphaned, and the namespace can never finalize.

  Fix (helm construct + reconciliation loop): helm runs ALL pre-delete hooks to completion
  BEFORE deleting any normal resource — so core-provider and every controller are still alive
  here. We delete the TOP-LEVEL `installer` CompositionDefinition and let core-provider's own
  reconciliation cascade the entire teardown while alive:
    installer CompositionDefinition deleted
      -> core-provider deletes its composition (the Installer CR)
        -> the Installer cdc uninstalls the composition release -> HOOK 1 drains the
           component tree in reverse-dependency order (controllers all alive)
        -> component CompositionDefinitions deleted, core-provider GCs the generated CRDs
      -> Installer CR finalizer clears -> still-exist finalizer clears
      -> core-provider Undeploys: removes the installers cdc Deployment + the installers CRD
      -> installer CompositionDefinition GONE
  This hook BLOCKS until that whole footprint is gone (no CompositionDefinitions, no
  composition.krateo.io CRDs, no ogen RestDefinitions). Only then does it return and let helm
  remove core-provider + the bootstrap scaffolding — nothing left to finalize, no orphan, the
  namespace finalizes cleanly.

  Runs as the admin-granted installer-self-bootstrap SA (NOT the cdc SA), so it needs no
  chart-inspector hook-RBAC workaround. activeDeadlineSeconds backstops a stuck object so the
  uninstall can never block forever.
*/}}
{{- if .Values.bootstrap.coreProvider.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: installer-bootstrap-teardown
  namespace: {{ .Values.namespaces.krateo }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: installer-self-bootstrap
      restartPolicy: Never
      containers:
        - name: drain
          image: alpine/k8s:1.31.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set +e
              NS={{ .Values.namespaces.krateo }}
              echo "pre-delete: deleting the installer CompositionDefinition — core-provider (alive) cascades the whole ordered teardown"
              kubectl delete compositiondefinitions.core.krateo.io installer -n "$NS" --wait=false 2>/dev/null
              echo "waiting for the ENTIRE krateo footprint to drain while controllers are alive..."
              for i in $(seq 1 170); do
                defs=$(kubectl get compositiondefinitions.core.krateo.io -A --no-headers 2>/dev/null | wc -l | tr -d ' ')
                crds=$(kubectl get crd -o name 2>/dev/null | grep -c 'composition\.krateo\.io')
                rest=$(kubectl get restdefinitions.ogen.krateo.io -A --no-headers 2>/dev/null | wc -l | tr -d ' ')
                if [ "$defs" = "0" ] && [ "$crds" = "0" ] && [ "${rest:-0}" = "0" ]; then
                  echo "krateo footprint fully drained — core-provider GC'd the installers CRD + cdc and cleared every finalizer"
                  break
                fi
                echo "  ...$defs CompositionDefinitions, $crds composition CRDs, ${rest:-0} RestDefinitions still draining"
                sleep 5
              done
              echo "pre-delete done — helm now removes core-provider + bootstrap scaffolding cleanly (nothing left to finalize)"
              exit 0
{{- end }}
