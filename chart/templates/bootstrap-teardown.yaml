{{- /*
  HOOK 2 — drain-before-controller-removal (bootstrap-release pre-delete).

  Problem the composition-layer hook can't solve: on `helm uninstall installer` (the
  symmetric teardown of the ONE bootstrap install), helm deletes EVERY resource in the
  bootstrap release in one pass — and core-provider lives in that release. If helm removes
  core-provider while the `installer` CompositionDefinition still carries its
  `still-exist-compositions-finalizer` (+ managedresource finalizer), nothing remains to
  clear it -> the CompositionDefinition is stuck Terminating forever, the per-composition
  cdc Deployment (installers-v<ver>-controller, created by core-provider at runtime, so NOT
  helm-owned) is orphaned, and the namespace can never finalize.

  Fix (helm construct + reconciliation loop): helm runs ALL pre-delete hooks to completion
  BEFORE deleting any normal resource — so core-provider and every component controller are
  still alive here. This hook deletes the Installer CR (which makes the cdc uninstall the
  composition release, firing HOOK 1's ordered intra-tree drain) and then BLOCKS until the
  whole tree is gone: no component CompositionDefinitions, no generated composition CRDs.
  Throughout that drain core-provider is alive, so it GCs every generated CRD and clears
  the `installer` CompositionDefinition's finalizers. Only when the hook returns does helm
  delete core-provider + the bootstrap scaffolding — by which point there is nothing left
  to finalize. No deadlock, no orphaned cdc Deployment, namespace finalizes cleanly.

  Runs as the admin-granted installer-self-bootstrap SA (NOT the cdc SA), so it needs no
  chart-inspector hook-RBAC workaround. Best-effort drain wait, then exit 0 so a stuck CR
  can never block the uninstall indefinitely (activeDeadlineSeconds backstops it).
*/}}
{{- if .Values.bootstrap.coreProvider.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: installer-bootstrap-teardown
  namespace: {{ .Values.namespaces.krateo }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: installer-self-bootstrap
      restartPolicy: Never
      containers:
        - name: drain
          image: alpine/k8s:1.31.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set +e
              NS={{ .Values.namespaces.krateo }}
              echo "pre-delete: deleting Installer CR — core-provider (still alive) drains the composition tree in order"
              kubectl delete installers.composition.krateo.io installer -n "$NS" --wait=false 2>/dev/null
              echo "waiting for the composition tree to fully drain while controllers are alive..."
              for i in $(seq 1 110); do
                # component composition CRDs left (everything except the installer's own 'installers' CRD)
                crds=$(kubectl get crd -o name 2>/dev/null | grep 'composition\.krateo\.io' | grep -vc 'installers\.composition\.krateo\.io')
                # component CompositionDefinitions left (everything except the bootstrap-owned 'installer')
                defs=$(kubectl get compositiondefinitions.core.krateo.io -n "$NS" --no-headers 2>/dev/null | awk '$1!="installer"' | wc -l | tr -d ' ')
                if [ "$crds" = "0" ] && [ "$defs" = "0" ]; then
                  echo "composition tree fully drained — core-provider GC'd the generated CRDs and cleared finalizers"
                  break
                fi
                echo "  ...$crds component CRDs, $defs component CompositionDefinitions still draining"
                sleep 5
              done
              echo "pre-delete done — helm now removes core-provider + bootstrap scaffolding cleanly (nothing left to finalize)"
              exit 0
{{- end }}
