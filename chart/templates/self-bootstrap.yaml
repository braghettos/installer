{{- /*
  D — self-reconcile. In BOOTSTRAP mode (a bare-cluster `helm install` with
  bootstrap.coreProvider.enabled=true) the umbrella brings up the engine + operators
  (subchart deps) and then registers ITSELF as an `Installer` composition:
    - an Installer CompositionDefinition pointing at this same OCI chart, and
    - a one-shot post-install hook Job that waits for the generated Installer CRD and
      applies an Installer CR whose spec is this release's values with bootstrap OFF.
  core-provider then reconciles that Installer CR on its loop, re-rendering the umbrella in
  COMPOSITION mode (Pass A + Pass B) so the component layers roll out automatically — no
  manual `helm upgrade`/up.sh. Pass A/B (definitions.yaml, compositions.yaml, secret.yaml)
  render ONLY in composition mode, so the bootstrap release doesn't double-own them.
*/}}
{{- if .Values.bootstrap.coreProvider.enabled }}
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: installer
  namespace: {{ .Values.namespaces.krateo }}
  labels:
    app.kubernetes.io/managed-by: krateo-installer
spec:
  chart:
    url: {{ .Values.ociRepo }}/installer
    version: {{ .Chart.Version | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: installer-self-bootstrap
  namespace: {{ .Values.namespaces.krateo }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: installer-self-bootstrap
rules:
  # delete/patch added for the pre-delete self-teardown hook (clears CRDs + stuck finalizers)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "delete", "patch"]
  - apiGroups: ["composition.krateo.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["core.krateo.io"]
    resources: ["compositiondefinitions"]
    verbs: ["get", "list", "delete", "patch"]
  - apiGroups: ["ogen.krateo.io"]
    resources: ["restdefinitions"]
    verbs: ["get", "list", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: installer-self-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: installer-self-bootstrap
subjects:
  - kind: ServiceAccount
    name: installer-self-bootstrap
    namespace: {{ .Values.namespaces.krateo }}
---
{{- /* RBAC for the Installer cdc's ServiceAccount (`installers-v<ver>`, created by
       core-provider once the Installer CRD is generated). The compositions.yaml render
       calls inst.lbip -> `lookup "v1" "Service"` to wire the frontend (consumer) config
       from peer LoadBalancer IPs, which needs `services` list/get. chart-inspector does not
       grant it, so the consumer render fails `services is forbidden`. We grant it here in
       BOOTSTRAP mode (applied by helm with admin creds — the cdc itself can't, that would be
       privilege escalation) so it's present before the cdc renders the consumer. The
       RoleBinding may reference the SA before it exists; it binds once core-provider creates
       it. SA name is derived from THIS chart's version (e.g. 0.2.31 -> installers-v0-2-31). */}}
{{- $cdcSA := printf "installers-v%s" (.Chart.Version | toString | replace "." "-") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: installers-lbip-services
  namespace: {{ .Values.namespaces.krateo }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: installers-lbip-services
  namespace: {{ .Values.namespaces.krateo }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: installers-lbip-services
subjects:
  - kind: ServiceAccount
    name: {{ $cdcSA }}
    namespace: {{ .Values.namespaces.krateo }}
---
{{- /* The Installer CR spec: only the umbrella's own keys (NOT the bootstrap subchart
       passthroughs like cert-manager/kagent, which carry huge default trees and are unused
       in composition mode), with all bootstrap flags OFF so the composition render does
       Pass A + Pass B only (no subcharts, no self-registration). */}}
{{- /* Do NOT pick "components": the component list (with each component's pinned chart
       version) is chart-internal structure, not user config. Baking it into the CR froze
       the versions so a chart upgrade couldn't bump them (the CR override shadowed the new
       chart values.yaml). Omitting it makes the Installer CR inherit the chart's own
       values.yaml components, so version bumps propagate through the self-reconcile. */}}
{{- $spec := pick .Values "ociRepo" "installDefinitions" "namespaces" "exposure" "features" "secrets" "vertexAI" "hitlApproval" }}
{{- $_ := set $spec "bootstrap" (dict "coreProvider" (dict "enabled" false) "certManager" (dict "enabled" false) "clickhouseOperator" (dict "enabled" false) "mongodbOperator" (dict "enabled" false) "kagent" (dict "enabled" false)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: installer-self-cr
  namespace: {{ .Values.namespaces.krateo }}
data:
  installer.yaml: |
    apiVersion: {{ include "inst.apiVersion" (list .Chart.Version) }}
    kind: Installer
    metadata:
      name: installer
      namespace: {{ .Values.namespaces.krateo }}
    spec:
{{ $spec | toYaml | indent 6 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: installer-self-bootstrap
  namespace: {{ .Values.namespaces.krateo }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 30
  template:
    spec:
      serviceAccountName: installer-self-bootstrap
      restartPolicy: OnFailure
      volumes:
        - name: cr
          configMap:
            name: installer-self-cr
      containers:
        - name: apply
          image: alpine/k8s:1.31.0
          volumeMounts:
            - name: cr
              mountPath: /cr
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "waiting for the generated Installer CRD..."
              until kubectl get crd installers.composition.krateo.io >/dev/null 2>&1; do sleep 5; done
              # wait until the CRD actually serves this chart's version
              until kubectl get installers.composition.krateo.io -n {{ .Values.namespaces.krateo }} >/dev/null 2>&1; do sleep 5; done
              echo "applying Installer CR — core-provider's cdc self-reconciles the rollout"
              kubectl apply -f /cr/installer.yaml
              # No cdc restart needed: composition-dynamic-controller rebuilds its discovery
              # every reconcile (NewCachedClients -> Invalidate) and inst.crdExists lists CRD
              # objects live, so Pass B picks up the component CRDs on the cdc's next reconcile.
              echo "done — Pass A + Pass B advance on the cdc reconcile loop"
---
{{- /* SELF-TEARDOWN — symmetric to the post-install self-bootstrap hook above. A single
       `helm uninstall installer` now tears everything down: this pre-delete hook runs WHILE
       core-provider is still alive and dismantles the composition tree first (which `helm
       uninstall` alone can't — the Installer + component compositions are owned by
       core-provider, not by this helm release). Order matters (learned the hard way):
         1. delete the Installer composition -> core-provider cascades to the component
            compositions -> each cdc helm-uninstalls its release -> the helm-templates-owned
            APP CRDs (authn.krateo.io and the templates.krateo.io widgets + restactions) deleted;
         2. clear oasgen finalizers on RestDefinitions early (they hang once oasgen-provider
            goes) so the namespace can finalize;
         3. force-clear stuck composition finalizers (wedged helm uninstalls) after a grace
            period so nothing hangs;
         4. delete CompositionDefinitions, then sweep the OPERATOR-GENERATED CRDs
            (composition/hyperdx/ogen) — these are never auto-GC'd, so they're the one thing
            that genuinely needs an explicit delete.
       Best-effort: `set +e` + `exit 0` so a partial failure never blocks the uninstall.
       (helm leaves the namespace itself — standard behavior; delete it separately if wanted.) */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: installer-self-teardown
  namespace: {{ .Values.namespaces.krateo }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: installer-self-bootstrap
      restartPolicy: Never
      containers:
        - name: teardown
          image: alpine/k8s:1.31.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set +e
              NS={{ .Values.namespaces.krateo }}
              echo "self-teardown: delete the Installer composition (cascade -> compositions -> cdc helm-uninstall -> app CRDs)"
              kubectl delete installers.composition.krateo.io --all -n $NS --wait=false
              echo "clear oasgen RestDefinition finalizers (they hang once oasgen-provider is gone)"
              for r in $(kubectl get restdefinitions.ogen.krateo.io -n $NS -o name 2>/dev/null); do kubectl patch "$r" -n $NS --type=merge -p '{"metadata":{"finalizers":null}}'; done
              kubectl delete restdefinitions.ogen.krateo.io --all -n $NS --wait=false 2>/dev/null
              echo "wait for the cascade to drain component compositions; force-clear stragglers after a grace period"
              for i in $(seq 1 24); do
                left=0
                for k in $(kubectl get crd 2>/dev/null | grep 'composition.krateo.io' | grep -v '^installers' | awk '{print $1}'); do
                  n=$(kubectl get "$k" -n $NS --no-headers 2>/dev/null | wc -l); left=$((left+n))
                  if [ "$i" -gt 6 ] && [ "$n" -gt 0 ]; then
                    for c in $(kubectl get "$k" -n $NS -o name 2>/dev/null); do kubectl patch "$c" -n $NS --type=merge -p '{"metadata":{"finalizers":null}}'; done
                  fi
                done
                [ "$left" -le 0 ] && break
                echo "  ...$left component compositions still finalizing"
                sleep 5
              done
              echo "delete CompositionDefinitions + clear finalizers (core-provider GCs generated CRDs)"
              for c in $(kubectl get installers.composition.krateo.io -n $NS -o name 2>/dev/null); do kubectl patch "$c" -n $NS --type=merge -p '{"metadata":{"finalizers":null}}'; done
              kubectl delete compositiondefinitions.core.krateo.io --all -n $NS --wait=false
              for c in $(kubectl get compositiondefinitions.core.krateo.io -n $NS -o name 2>/dev/null); do kubectl patch "$c" -n $NS --type=merge -p '{"metadata":{"finalizers":null}}'; done
              echo "sweep operator-generated CRDs the cascade can't remove (composition/hyperdx/ogen + app groups)"
              kubectl get crd 2>/dev/null | grep -iE 'composition.krateo.io|hyperdx.krateo.io|ogen.krateo.io|templates.krateo.io|authn.krateo.io' | awk '{print $1}' | xargs -r kubectl delete crd --wait=false
              echo "self-teardown done — helm now removes the bootstrap subcharts (core-provider, etc.)"
              exit 0
{{- end }}
