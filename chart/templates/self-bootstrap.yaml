{{- /*
  D — self-reconcile. In BOOTSTRAP mode (a bare-cluster `helm install` with
  bootstrap.coreProvider.enabled=true) the umbrella brings up the engine + operators
  (subchart deps) and then registers ITSELF as an `Installer` composition:
    - an Installer CompositionDefinition pointing at this same OCI chart, and
    - a one-shot post-install hook Job that waits for the generated Installer CRD and
      applies an Installer CR whose spec is this release's values with bootstrap OFF.
  core-provider then reconciles that Installer CR on its loop, re-rendering the umbrella in
  COMPOSITION mode (Pass A + Pass B) so the component layers roll out automatically — no
  manual `helm upgrade`/up.sh. Pass A/B (definitions.yaml, compositions.yaml, secret.yaml)
  render ONLY in composition mode, so the bootstrap release doesn't double-own them.
*/}}
{{- if .Values.bootstrap.coreProvider.enabled }}
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: installer
  namespace: {{ .Values.namespaces.krateo }}
  labels:
    app.kubernetes.io/managed-by: krateo-installer
spec:
  chart:
    url: {{ .Values.ociRepo }}/installer
    version: {{ .Chart.Version | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: installer-self-bootstrap
  namespace: {{ .Values.namespaces.krateo }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: installer-self-bootstrap
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["composition.krateo.io"]
    resources: ["installers"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: installer-self-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: installer-self-bootstrap
subjects:
  - kind: ServiceAccount
    name: installer-self-bootstrap
    namespace: {{ .Values.namespaces.krateo }}
---
{{- /* RBAC for the Installer cdc's ServiceAccount (`installers-v<ver>`, created by
       core-provider once the Installer CRD is generated). The compositions.yaml render
       calls inst.lbip -> `lookup "v1" "Service"` to wire the frontend (consumer) config
       from peer LoadBalancer IPs, which needs `services` list/get. chart-inspector does not
       grant it, so the consumer render fails `services is forbidden`. We grant it here in
       BOOTSTRAP mode (applied by helm with admin creds — the cdc itself can't, that would be
       privilege escalation) so it's present before the cdc renders the consumer. The
       RoleBinding may reference the SA before it exists; it binds once core-provider creates
       it. SA name is derived from THIS chart's version (e.g. 0.2.31 -> installers-v0-2-31). */}}
{{- $cdcSA := printf "installers-v%s" (.Chart.Version | toString | replace "." "-") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: installers-lbip-services
  namespace: {{ .Values.namespaces.krateo }}
rules:
  # services: for compositions.yaml inst.lbip (lookup "v1" "Service") wiring the frontend config.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # jobs + composition.krateo.io/*: for the pre-delete ORDERED-TEARDOWN hook Job
  # (ordered-teardown.yaml), which runs as this cdc SA and deletes the APP compositions before
  # helm removes the *-crd CompositionDefinitions. chart-inspector doesn't scan hooks, so grant
  # the Job-management + composition-delete verbs here (admin side).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["composition.krateo.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: installers-lbip-services
  namespace: {{ .Values.namespaces.krateo }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: installers-lbip-services
subjects:
  - kind: ServiceAccount
    name: {{ $cdcSA }}
    namespace: {{ .Values.namespaces.krateo }}
---
{{- /* The Installer CR spec: only the umbrella's own keys (NOT the bootstrap subchart
       passthroughs like cert-manager/kagent, which carry huge default trees and are unused
       in composition mode), with all bootstrap flags OFF so the composition render does
       Pass A + Pass B only (no subcharts, no self-registration). */}}
{{- /* Do NOT pick "components": the component list (with each component's pinned chart
       version) is chart-internal structure, not user config. Baking it into the CR froze
       the versions so a chart upgrade couldn't bump them (the CR override shadowed the new
       chart values.yaml). Omitting it makes the Installer CR inherit the chart's own
       values.yaml components, so version bumps propagate through the self-reconcile. */}}
{{- $spec := pick .Values "ociRepo" "installDefinitions" "namespaces" "exposure" "features" "secrets" "vertexAI" "hitlApproval" }}
{{- $_ := set $spec "bootstrap" (dict "coreProvider" (dict "enabled" false) "certManager" (dict "enabled" false) "clickhouseOperator" (dict "enabled" false) "mongodbOperator" (dict "enabled" false) "kagent" (dict "enabled" false)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: installer-self-cr
  namespace: {{ .Values.namespaces.krateo }}
data:
  installer.yaml: |
    apiVersion: {{ include "inst.apiVersion" (list .Chart.Version) }}
    kind: Installer
    metadata:
      name: installer
      namespace: {{ .Values.namespaces.krateo }}
    spec:
{{ $spec | toYaml | indent 6 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: installer-self-bootstrap
  namespace: {{ .Values.namespaces.krateo }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 30
  template:
    spec:
      serviceAccountName: installer-self-bootstrap
      restartPolicy: OnFailure
      volumes:
        - name: cr
          configMap:
            name: installer-self-cr
      containers:
        - name: apply
          image: alpine/k8s:1.31.0
          volumeMounts:
            - name: cr
              mountPath: /cr
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "waiting for the generated Installer CRD..."
              until kubectl get crd installers.composition.krateo.io >/dev/null 2>&1; do sleep 5; done
              # wait until the CRD actually serves this chart's version
              until kubectl get installers.composition.krateo.io -n {{ .Values.namespaces.krateo }} >/dev/null 2>&1; do sleep 5; done
              echo "applying Installer CR — core-provider's cdc self-reconciles the rollout"
              kubectl apply -f /cr/installer.yaml
              # No cdc restart needed: composition-dynamic-controller rebuilds its discovery
              # every reconcile (NewCachedClients -> Invalidate) and inst.crdExists lists CRD
              # objects live, so Pass B picks up the component CRDs on the cdc's next reconcile.
              echo "done — Pass A + Pass B advance on the cdc reconcile loop"
{{- end }}
