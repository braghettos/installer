{{/*
  Replicate the ClickHouse credentials Secret that ClickStack creates in its own namespace
  into the krateo namespace, where the otel-collector Composition's pods expect it
  (env: CH_USERNAME/CH_PASSWORD from secret "otel-clickhouse-credentials"). ClickStack only
  emits it in .Values.namespaces.clickhouse; the collectors run in .Values.namespaces.krateo.
  Reconcile-time `lookup`: emitted once ClickStack has created the source Secret, kept in
  sync on every re-render. Avoids the post-install cross-namespace `kubectl` copy.
*/}}
{{- if .Values.features.observability }}
{{- $src := lookup "v1" "Secret" .Values.namespaces.clickhouse "otel-clickhouse-credentials" }}
{{- if and $src $src.data }}
apiVersion: v1
kind: Secret
metadata:
  name: otel-clickhouse-credentials
  namespace: {{ .Values.namespaces.krateo }}
  labels:
    app.kubernetes.io/managed-by: krateo-installer
    krateo.io/replicated-from: {{ .Values.namespaces.clickhouse }}
type: Opaque
data:
{{- range $k, $v := $src.data }}
  {{ $k }}: {{ $v }}
{{- end }}
{{- end }}
{{- end }}
