{{/*
  Pass B: emit each component's Composition, gated on:
    - feature flag enabled
    - the component's generated CRD existing (inst.crdExists)
    - all deps Ready=True (inst.depsReady)
  Re-evaluated every reconcile; the next layer unlocks as deps go Ready.

  Exposure / config (the model documented in values.yaml `exposure`) is resolved here at
  reconcile time — no post-install `kubectl patch` needed:
    - components marked `expose: true` get spec.service.type = .Values.exposure.type
      (LoadBalancer | NodePort); for Ingress the Service stays chart-default (ClusterIP).
    - the `consumer: true` component (frontend) gets spec.config.<KEY> for each peer that
      declares `configKeys`, with the URL built from that peer's LoadBalancer IP via
      `inst.lbip`. Until the cloud assigns the IP the key is omitted, so the frontend keeps
      its chart default; the next reconcile (core-provider re-renders the umbrella) fills it
      in as soon as the peer's external IP is ready. The frontend serves config.json to the
      browser as a static file, so the updated ConfigMap is picked up on page reload — no
      pod restart required.
*/}}
{{- if not .Values.bootstrap.coreProvider.enabled }}
{{- $top := . }}
{{- $isLB := or (eq .Values.exposure.type "LoadBalancer") (eq .Values.exposure.type "NodePort") }}
{{- range $c := .Values.components }}
{{- if eq (include "inst.featureEnabled" (list $top $c.feature)) "true" }}
{{- $crd  := include "inst.crdExists" (list $c.kind $c.version) }}
{{- $deps := include "inst.depsReady" (list $top $c.deps $top.Values.components) }}
{{- if and (eq $crd "true") (eq $deps "true") }}
{{- $spec := dict }}
{{- if and $c.expose $isLB }}
{{- $_ := set $spec "service" (dict "type" $top.Values.exposure.type) }}
{{- end }}
{{- if $c.consumer }}
{{- $cfg := dict }}
{{- range $d := $top.Values.components }}
{{- if $d.configKeys }}
{{- $ip := include "inst.lbip" (list $top $d.svcMatch) }}
{{- if $ip }}
{{- range $k := $d.configKeys }}
{{- $_ := set $cfg $k (printf "http://%s:%v" $ip $d.exposePort) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if gt (len $cfg) 0 }}
{{- $_ := set $spec "config" $cfg }}
{{- end }}
{{- end }}
{{- /* Vertex AI passthrough: components flagged vertexAI:true (krateo-autopilot) get the
       umbrella's .Values.vertexAI injected into their Composition spec, so the autopilot
       ModelConfigs use GeminiVertexAI via ADC. */}}
{{- if and $c.vertexAI $top.Values.vertexAI.enabled }}
{{- $_ := set $spec "vertexAI" (dict "enabled" true "projectID" $top.Values.vertexAI.projectID "location" $top.Values.vertexAI.location) }}
{{- end }}
{{- /* HITL approval gate for the autopilot's mutating k8s tools (vertexAI:true == the autopilot). */}}
{{- if $c.vertexAI }}
{{- $_ := set $spec "hitlApproval" $top.Values.hitlApproval }}
{{- end }}
{{- /* componentValues: per-component spec overrides, deep-merged into the rendered spec. The
       installer-computed wiring above (service/config/vertexAI/hitlApproval) stays AUTHORITATIVE
       — `merge` gives the dest ($spec) precedence, so it wins on any leaf conflict — letting a
       customer add/override anything else (including nested keys like service.annotations or
       resources) on the LIVE Installer composition without breaking exposure or portal config.
       These component CRs are installer-managed (Pass B re-renders every reconcile), so this is
       the ONLY durable way to customize a component's spec; a direct kubectl edit reverts. */}}
{{- $custom := default dict (index ($top.Values.componentValues | default dict) $c.name) }}
{{- $spec = merge $spec (deepCopy $custom) }}
{{- /* Gate the orchestrator's extraAgents (a2a sub-agents) to agents that are actually
       deployed: a reference to an Agent whose component is feature-disabled (e.g. the 9
       specialists in the agent-only profile) makes kagent fail to compile the orchestrator
       ("Agent <name> not found"). Filter extraAgents to components whose feature is enabled. */}}
{{- if hasKey $spec "extraAgents" }}
{{- $enabled := dict }}
{{- range $comp := $top.Values.components }}
{{- if eq (include "inst.featureEnabled" (list $top $comp.feature)) "true" }}
{{- $_ := set $enabled $comp.name true }}
{{- end }}
{{- end }}
{{- $keep := list }}
{{- range $ea := $spec.extraAgents }}
{{- if hasKey $enabled $ea.name }}{{- $keep = append $keep $ea }}{{- end }}
{{- end }}
{{- $_ := set $spec "extraAgents" $keep }}
{{- end }}
---
apiVersion: {{ include "inst.apiVersion" (list $c.version) }}
kind: {{ $c.kind }}
metadata:
  name: {{ $c.name }}
  namespace: {{ $top.Values.namespaces.krateo }}
  labels:
    app.kubernetes.io/managed-by: krateo-installer
    krateo.io/tier: {{ $c.tier }}
spec: {{- $spec | toYaml | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
