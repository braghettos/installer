apiVersion: v2
# Umbrella ORCHESTRATOR blueprint for Krateo PlatformOps. It does not bundle the
# component charts; it sequences the per-component blueprints (forked into the
# braghettos org) into one ordered, readiness-gated install:
#   1. registers every component CompositionDefinition (installDefinitions=true), then
#   2. emits each component Composition only once its prerequisites' Compositions report
#      Ready=True and the component's generated CRD exists (Helm `lookup`).
# The CompositionDefinition controller re-reconciles, so each pass `lookup` sees more
# components become Ready and emits the next layer until the platform is up.
# Pinned to installer 2.7.0 component versions. Kind: Installer.
name: installer
type: application
version: CHART_VERSION
appVersion: "2.7.0"
home: https://krateo.io
sources:
  - https://github.com/braghettos/installer

# Bootstrap dependency: the Krateo composition engine (core-provider) + its dedicated CRD
# chart, pulled from the braghettos OCI registry. Conditioned on bootstrap.coreProvider.enabled
# so it is skipped when registering the umbrella on an already-running Krateo. CRDs first,
# then the controller; the install is expected to run with --wait so the engine is Ready
# before core-provider reconciles the umbrella's compositions.
dependencies:
  - name: core-provider-crd
    version: "0.35.2"
    repository: oci://ghcr.io/braghettos/charts
    condition: bootstrap.coreProvider.enabled
  - name: core-provider
    version: "0.35.2"
    repository: oci://ghcr.io/braghettos/charts
    condition: bootstrap.coreProvider.enabled
