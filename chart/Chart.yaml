apiVersion: v2
# Umbrella ORCHESTRATOR blueprint for Krateo PlatformOps. It does not bundle the
# component charts; it sequences the per-component blueprints (forked into the
# braghettos org) into one ordered, readiness-gated install:
#   1. registers every component CompositionDefinition (installDefinitions=true), then
#   2. emits each component Composition only once its prerequisites' Compositions report
#      Ready=True and the component's generated CRD exists (Helm `lookup`).
# The CompositionDefinition controller re-reconciles, so each pass `lookup` sees more
# components become Ready and emits the next layer until the platform is up.
# Pinned to installer 2.7.0 component versions. Kind: Installer.
name: installer
type: application
version: CHART_VERSION
appVersion: "2.7.0"
home: https://krateo.io
sources:
  - https://github.com/braghettos/installer

# Bootstrap dependency: the Krateo composition engine controller (core-provider).
#
# The engine's CRD chart (krateo-core-provider-crd) is NOT bundled here. It is applied as
# the FIRST bootstrap step in its own helm release — `helm install krateo-core-provider-crd`
# — BEFORE this umbrella. Reason: the umbrella creates CompositionDefinition CRs in this
# release, and the dedicated CRD chart ships its CRDs in templates/ (uniform standard,
# resource-policy: keep — NO crds/ exception for core-provider). A CRD in templates/ is not
# pre-established within its own release, so it must land in a SEPARATE earlier release; then
# helm can bind this umbrella's CompositionDefinition CRs. See QUICKSTART (two-step bootstrap).
dependencies:
  # composition engine controller (its CRDs are pre-applied separately; see above)
  - name: krateo-core-provider
    version: "0.36.7"
    repository: oci://ghcr.io/braghettos/krateo
    condition: bootstrap.coreProvider.enabled
  # observability operators (ClickStack 3.0.0 prerequisites). cert-manager must be Ready
  # before the ClickHouse operator (webhook cert) — see bootstrap notes / Phase 5.
  - name: cert-manager
    version: "v1.20.2"
    repository: https://charts.jetstack.io
    condition: bootstrap.certManager.enabled
  - name: clickhouse-operator-helm
    version: "0.0.5"
    repository: oci://ghcr.io/clickhouse
    condition: bootstrap.clickhouseOperator.enabled
  - name: community-operator
    version: "0.13.0"
    repository: https://mongodb.github.io/helm-charts
    condition: bootstrap.mongodbOperator.enabled
  # kagent (agentic platform) is NO LONGER a bootstrap subchart — it is installed as two
  # compositions (kagent-crds -> kagent, see values.yaml components), wrapping the unforked
  # upstream charts. CRD establishment is handled by composition dependency ordering instead
  # of a crds/ pre-install, which also makes teardown clean (helm-templates/-owned CRDs).
