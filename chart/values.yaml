# ---------------------------------------------------------------------------
# Krateo PlatformOps installer — umbrella orchestrator values
# ---------------------------------------------------------------------------
ociRepo: oci://ghcr.io/braghettos/charts

# Whether pass A (register component CompositionDefinitions) runs.
installDefinitions: true

# Bootstrap: bring up the Krateo composition engine (core-provider + its CRDs) as the
# umbrella's hook-weighted Helm subchart dependency, so a bare-cluster `helm install`
# self-bootstraps: the engine comes up first (CRDs at hook-weight -10, controller at -5,
# all with --wait), then core-provider reconciles the umbrella's own Composition and drives
# the lookup-gated rollout of everything in `components`.
# Set enabled=false when REGISTERING this umbrella on an already-running Krateo (the engine
# already exists; the subchart would be redundant).
bootstrap:
  coreProvider:
    enabled: true
    version: "0.35.2"
  # ClickStack 3.0.0 operator prerequisites (disable any already present on the cluster).
  certManager:
    enabled: true
  clickhouseOperator:
    enabled: true
  mongodbOperator:
    enabled: true
  kagent:
    enabled: true
# Subchart value passthroughs (only used when the matching bootstrap flag is enabled).
core-provider: {}
core-provider-crd: {}
cert-manager:
  crds:
    enabled: true     # install cert-manager CRDs with the operator
clickhouse-operator-helm: {}
community-operator: {}
kagent-crds: {}
kagent:
  # operator only; no LLM provider configured at the operator level (agents bring their own ModelConfig)
  providers:
    default: ""

# Namespaces the umbrella manages.
namespaces:
  krateo: krateo-system
  clickhouse: clickhouse-system

# Exposure model for browser-facing components (authn, snowplow, frontend, hyperdx,
# sse-proxy). Replaces the installer's `var` Service-IP/port extraction.
#   NodePort | LoadBalancer -> resolved via Helm `lookup` at reconcile time
#   Ingress                 -> built from the host inputs below
exposure:
  type: NodePort          # NodePort | LoadBalancer | Ingress
  ingress:
    enabled: false
    domain: ""            # e.g. krateo.example.com -> authn.<domain>, snowplow.<domain>, ...
    authnHost: ""
    snowplowHost: ""
    frontendHost: ""
    hyperdxHost: ""

# Feature flags (carried over from the installer chart).
features:
  composableportal: true          # authn -> snowplow -> frontend -> portal
  composableportalstarter: true   # portal (composable-portal-starter)
  composableoperations: true      # core-provider
  oasgenprovider: true            # oasgen-provider
  observability: true             # clickstack/otel/agents group
  observabilityAgents: true       # kagent operator + krateo-autopilot + MCP tools
  githubMcp: false                # GitHub MCP (hosted RemoteMCPServer)
  podRestartAlert: false          # pod-restart alert pipeline

# Sensitive inputs are referenced by Secret name; never inline values.
secrets:
  geminiApiKey: gemini-api-key          # required when observabilityAgents=true
  gcloudCredentials: gcloud-credentials # optional Vertex AI
  githubMcpPat: github-mcp-pat          # only if self-hosting GitHub MCP

# ---------------------------------------------------------------------------
# Component DAG. `deps` = component names whose Compositions must be Ready=True
# before this one's Composition is emitted. Versions pinned to installer 2.7.0.
# `repo` overrides ociRepo when a component lives elsewhere; `feature` gates it.
# ---------------------------------------------------------------------------
components:
  # NOTE: core-provider (the composition engine) is NOT here — it is installed as the
  # umbrella's bootstrap Helm subchart dependency (see `bootstrap` above / Chart.yaml),
  # so it comes up before any composition is reconciled. Everything below is a gated
  # composition driven by that engine.
  #
  # ---- platform CRDs (golden rule: dedicated CRD charts, installed before their app) ----
  - { name: authn-crd,           kind: AuthnCrd,          version: "0.22.2",   deps: [], tier: platform, feature: composableportal }
  - { name: oasgen-provider-crd, kind: OasgenProviderCrd, version: "0.9.0",    deps: [], tier: platform, feature: oasgenprovider }
  - { name: frontend-crd,        kind: FrontendCrd,       version: "1.0.10",   deps: [], tier: platform, feature: composableportal, repo: oci://ghcr.io/braghettos/krateo }
  - { name: snowplow-crd,        kind: SnowplowCrd,       version: "0.30.249", deps: [], tier: platform, feature: composableportal }
  # ---- platform apps (each depends on its dedicated CRD composition being Ready) ----
  - { name: authn,           kind: Authn,          version: "0.22.2",   deps: [authn-crd],                      tier: platform, feature: composableportal, expose: true, exposePort: 8082, svcMatch: authn, configKeys: [AUTHN_API_BASE_URL] }
  - { name: snowplow,        kind: Snowplow,       version: "0.30.249", deps: [snowplow-crd],                   tier: platform, feature: composableportal, expose: true, exposePort: 8081, svcMatch: snowplow, configKeys: [SNOWPLOW_API_BASE_URL] }
  - { name: frontend,        kind: Frontend,       version: "1.0.10",   deps: [frontend-crd, authn, snowplow],  tier: platform, feature: composableportal, repo: oci://ghcr.io/braghettos/krateo, expose: true, exposePort: 8080, svcMatch: frontend, consumer: true }
  - { name: portal,          kind: Portal,         version: "1.2.2",    deps: [frontend],                       tier: platform, feature: composableportalstarter, repo: oci://ghcr.io/braghettos }
  - { name: oasgen-provider, kind: OasgenProvider, version: "0.9.0",    deps: [oasgen-provider-crd],            tier: platform, feature: oasgenprovider }

  # ---- observability ----
  # clickstack is helm-installed directly (operator-CRD values are too complex for core-provider CRD-gen)
  - { name: otel-collector-deployment, kind: OtelCollectorDeployment, version: "0.1.0", deps: [],                tier: observability, feature: observability, repo: oci://ghcr.io/braghettos/krateo }
  - { name: otel-collector-daemonset,  kind: OtelCollectorDaemonset,  version: "0.1.0", deps: [otel-collector-deployment], tier: observability, feature: observability, repo: oci://ghcr.io/braghettos/krateo }
  - { name: krateo-sse-proxy,          kind: KrateoSseProxy,         version: "0.1.0", deps: [],                 tier: observability, feature: observability, repo: oci://ghcr.io/braghettos/krateo, expose: true, exposePort: 8080, svcMatch: sse-proxy, configKeys: [EVENTS_API_BASE_URL, EVENTS_PUSH_API_BASE_URL] }

  # ---- agents (kagent / kmcp-managed tools) ----
  # kagent operator is referenced upstream (pinned >= v0.6.3); see templates/_notes.
  - { name: krateo-autopilot,    kind: KrateoAutopilot,    version: "0.1.0", deps: [],            tier: observability, feature: observabilityAgents, repo: oci://ghcr.io/braghettos/krateo }
