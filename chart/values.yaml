# ---------------------------------------------------------------------------
# Krateo PlatformOps installer — umbrella orchestrator values
# ---------------------------------------------------------------------------
ociRepo: oci://ghcr.io/braghettos/krateo

# Registry credentials for pulling component charts from a PRIVATE/authenticated OCI
# registry. core-provider pulls each component chart IN-CLUSTER (and the umbrella's
# self-reconcile pulls this installer chart), so private repos need a passwordRef to a
# Secret living in namespaces.krateo. (The bootstrap `helm install` itself authenticates
# with your local `helm registry login`; this is only for the in-cluster pulls.)
# When enabled, every component CompositionDefinition + the installer one get
# spec.chart.credentials. One ghcr.io credential covers all braghettos/* component repos.
registryAuth:
  enabled: false
  username: ""
  passwordRef:
    name: ""
    namespace: ""   # empty defaults to namespaces.krateo
    key: ""
  # Skip TLS verification on the in-cluster chart pull (e.g. a self-signed registry).
  # Maps to CompositionDefinition spec.chart.insecureSkipVerifyTLS; independent of auth.
  insecureSkipVerifyTLS: false

# Whether pass A (register component CompositionDefinitions) runs.
installDefinitions: true

# Bootstrap: bring up the Krateo composition engine (core-provider + its CRDs) as the
# umbrella's hook-weighted Helm subchart dependency, so a bare-cluster `helm install`
# self-bootstraps: the engine comes up first (CRDs at hook-weight -10, controller at -5,
# all with --wait), then core-provider reconciles the umbrella's own Composition and drives
# the lookup-gated rollout of everything in `components`.
# Set enabled=false when REGISTERING this umbrella on an already-running Krateo (the engine
# already exists; the subchart would be redundant).
bootstrap:
  coreProvider:
    # The engine subchart version is pinned in Chart.yaml (krateo-core-provider: 0.36.7, app
    # core-provider 2.0.2 — de-webhooked, needs k8s >= 1.36); this flag only toggles installing it.
    enabled: true
  # ClickStack 3.0.0 operator prerequisites (disable any already present on the cluster).
  certManager:
    enabled: true
  clickhouseOperator:
    enabled: true
  mongodbOperator:
    enabled: true
  kagent:
    enabled: true
# Subchart value passthroughs (only used when the matching bootstrap flag is enabled).
# core-provider / core-provider-crd take no overrides by default (omit = chart defaults).
cert-manager:
  crds:
    enabled: true     # install cert-manager CRDs with the operator
clickhouse-operator-helm:
  # No admission webhook / cert-manager Certificates — so the umbrella renders no
  # cert-manager CRs at install (the operator still reconciles ClickHouseCluster).
  certManager:
    enable: false
  webhook:
    enable: false
# community-operator / kagent-crds take no overrides by default (omit = chart defaults).
# NOTE: kagent is no longer configured here as a bootstrap subchart. It is installed as two
# compositions — `kagent-crds` then `kagent` (see the components list). The sample-agent
# disabling now lives in the kagent wrapper chart's own default values (braghettos/kagent).

# Namespaces the umbrella manages. The observability stack (ClickStack, collectors,
# MCP, agents) now runs entirely in `krateo` — there is no separate clickhouse
# namespace anymore (the install.sh-era clickhouse-system split is gone).
namespaces:
  krateo: krateo-system
  clickhouse: krateo-system

# Exposure model for browser-facing components (authn, snowplow, frontend, hyperdx,
# sse-proxy). Replaces the installer's `var` Service-IP/port extraction.
#   NodePort | LoadBalancer -> resolved via Helm `lookup` at reconcile time
#   Ingress                 -> built from the host inputs below
exposure:
  type: NodePort          # NodePort | LoadBalancer | Ingress
  ingress:
    enabled: false
    domain: ""            # e.g. krateo.example.com -> authn.<domain>, snowplow.<domain>, ...
    authnHost: ""
    snowplowHost: ""
    frontendHost: ""
    hyperdxHost: ""

# Feature flags (carried over from the installer chart).
features:
  composableportal: true          # authn -> snowplow -> frontend -> portal
  composableportalstarter: true   # portal (composable-portal-starter)
  composableoperations: true      # engine-present MARKER: core-provider is always-on via bootstrap (gates no component here)
  oasgenprovider: true            # oasgen-provider
  observability: true             # clickstack/otel/agents group
  observabilityAgents: true       # MINIMAL agent layer: kagent + krateo-installer-agent + krateo-autopilot
  specialistAgents: true          # the 9 specialist/codegen agents + clickhouse-mcp (need observabilityAgents)
  githubMcp: false                # GitHub MCP (hosted RemoteMCPServer)
  podRestartAlert: false          # pod-restart alert pipeline

# Sensitive inputs are referenced by Secret name; never inline values.
secrets:
  geminiApiKey: gemini-api-key          # required when observabilityAgents=true AND vertexAI.enabled=false
  githubMcpPat: github-mcp-pat          # only if self-hosting GitHub MCP

# HITL approval gate for the autopilot's mutating Kubernetes tools. true (default)=
# pause for human approval before any cluster change; false=autonomous remediation.
hitlApproval: true

# Gemini Vertex AI for the autopilot agents (functional LLM, no API key).
# When enabled, the krateo-autopilot ModelConfigs use provider GeminiVertexAI with
# Application Default Credentials: the kagent agent pods authenticate to Vertex via the
# GKE node SA token from the metadata server. Requirements on the node pool:
#   - OAuth scope https://www.googleapis.com/auth/cloud-platform
#   - the node SA has an IAM role covering aiplatform.* (roles/aiplatform.user or roles/editor)
# No API key and no downloaded SA-key file are needed. Injected into the autopilot
# Composition spec by templates/compositions.yaml (components with vertexAI: true).
vertexAI:
  enabled: true
  # REQUIRED when enabled: set to your own GCP project hosting Vertex AI
  # (e.g. --set vertexAI.projectID=<your-gcp-project>). No default — must be provided per-install.
  projectID: ""
  # `global` is Google's recommended endpoint for Gemini 2.5 — it routes across regions instead of
  # pinning one regional Dynamic Shared Quota pool, giving the best availability / lowest 429 rate
  # for the agent fan-out. Override per-install with --set vertexAI.location=<region> if you need
  # regional data residency.
  location: global

# Local LLM (Ollama) — OPT-IN, off by default (vertexAI above stays the default). When enabled,
# the whole agent fleet runs on ONE local, no-cloud model instead of Gemini/Vertex:
#   - the model OWNER (krateo-autopilot, modelOwner:true) renders its gemini-flash/gemini-pro
#     ModelConfigs as provider Ollama pointing at `host`, with the model id from `model`;
#   - every other agent (installer-agent + the 9 specialists) is pointed at the owner's
#     `refName` ModelConfig (create:false) — so no per-agent-chart change is needed.
# Point `host` at an in-cluster Ollama Service. Use a TOOL-CALLING-capable model (the agents are
# tool-heavy — k8s_patch_resource, helm_*): qwen3.6 is recommended; gemma4 works but is fragile;
# gemma <=3 cannot tool-call. See QUICKSTART "Run the agent layer on a local model (Ollama)".
localModel:
  enabled: false
  host: ""                 # e.g. http://ollama.ollama.svc.cluster.local:11434
  model: qwen3.6
  refName: gemini-flash    # the owner-created ModelConfig the other agents reference

# ---------------------------------------------------------------------------
# Per-component spec overrides, keyed by component name. Each entry is deep-merged
# into that component's rendered Composition spec (Pass B). The installer-computed
# wiring (service.type / config / vertexAI / hitlApproval) stays authoritative — it
# wins on any leaf conflict — so you can safely add anything else here (e.g.
# resources, replicaCount, service.annotations) and edit it in place on the live
# Installer composition; a direct kubectl edit of the component CR reverts.
# Default below registers the installer's federated agent on the autopilot orchestrator (the
# single entry point). Add per-component overrides here too, e.g.:
#     snowplow:
#       replicaCount: 2
componentValues:
  # Pin the kagent composition's resource names to a fixed "kagent" prefix (instead of the
  # core-provider-generated release name like kagent-<hash>). The kagent tool server is named
  # "{{ kagent.fullname }}-tool-server"; the autopilot/installer-agent/k8s-agent/helm-agent all
  # reference the RemoteMCPServer "kagent-tool-server" by the kagent default-install convention,
  # so without a fixed name kagent fails to compile them ("RemoteMCPServer kagent-tool-server not found").
  kagent:
    kagentapp:
      fullnameOverride: kagent
  krateo-autopilot:
    extraAgents:
      - name: krateo-installer-agent
      - name: krateo-authn-agent
      - name: krateo-snowplow-agent
      - name: krateo-frontend-agent
      - name: krateo-clickstack-agent
      - name: krateo-core-provider-agent
      - name: krateo-code-analysis-agent
      - name: krateo-docs-agent
      - name: krateo-ansible-to-operator-agent
      - name: krateo-tf-provider-to-operator-agent
      - name: krateo-tf-to-helm-agent

# ---------------------------------------------------------------------------
# Component DAG. `deps` = component names whose Compositions must be Ready=True
# before this one's Composition is emitted. Versions pinned to installer 2.7.0.
# `repo` overrides ociRepo when a component lives elsewhere; `feature` gates it.
# ---------------------------------------------------------------------------
components:
  # NOTE: core-provider (the composition engine) is NOT here — it is installed as the
  # umbrella's bootstrap Helm subchart dependency (see `bootstrap` above / Chart.yaml),
  # so it comes up before any composition is reconciled. Everything below is a gated
  # composition driven by that engine.
  #
  # ---- platform CRDs: unforked dependency-wrappers over upstream krateoplatformops CRD
  #      charts (braghettos/krateo). CRDs ship in the upstream templates/ (helm-owned ->
  #      clean teardown); the wrapper only adds the values.schema.json core-provider needs. ----
  - name: authn-crd
    kind: KrateoAuthnCrd
    chart: krateo-authn-crd
    version: "0.22.4"
    tier: platform
    feature: composableportal
  - name: oasgen-provider-crd
    kind: KrateoOasgenProviderCrd
    chart: krateo-oasgen-provider-crd
    version: "0.9.5"
    tier: platform
    feature: oasgenprovider
  - name: frontend-crd
    kind: KrateoFrontendCrd
    chart: krateo-frontend-crd
    version: "1.0.25"
    tier: platform
    feature: composableportal
  - name: snowplow-crd
    kind: KrateoSnowplowCrd
    chart: krateo-snowplow-crd
    version: "0.21.1"
    tier: platform
    feature: composableportal

  # ---- platform apps (each depends on its dedicated CRD composition being Ready) ----
  - name: authn
    kind: KrateoAuthn
    chart: krateo-authn
    version: "0.22.6"
    deps:
      - authn-crd
    tier: platform
    feature: composableportal
    expose: true
    exposePort: 8082
    svcMatch: authn
    configKeys:
      - AUTHN_API_BASE_URL
  - name: snowplow
    kind: KrateoSnowplow
    chart: krateo-snowplow
    version: "1.0.10"
    deps:
      - snowplow-crd
    tier: platform
    feature: composableportal
    expose: true
    exposePort: 8081
    svcMatch: snowplow
    configKeys:
      - SNOWPLOW_API_BASE_URL
  - name: frontend
    kind: KrateoFrontend
    chart: krateo-frontend
    version: "1.0.16"
    deps:
      - frontend-crd
      - authn
      - snowplow
    tier: platform
    feature: composableportal
    expose: true
    exposePort: 8080
    svcMatch: frontend
    consumer: true
  - name: portal
    kind: Portal
    version: "1.2.3"
    deps:
      - frontend
    tier: platform
    feature: composableportalstarter
  - name: oasgen-provider
    kind: KrateoOasgenProvider
    chart: krateo-oasgen-provider
    version: "0.9.4"
    deps:
      - oasgen-provider-crd
    tier: platform
    feature: oasgenprovider

  # ---- HyperDX operator (generated by oasgen-provider from an OpenAPI spec) ----
  # Ships RestDefinitions that oasgen-provider turns into Webhook/Alert CRDs +
  # controllers, replacing the imperative obs-stack pod-restart-alert/*.sh scripts.
  # Requires features.oasgenprovider=true (for the oasgen-provider dep).
  - name: hyperdx-provider
    kind: HyperdxProvider
    version: "0.1.2"
    deps:
      - oasgen-provider
    tier: observability
    feature: podRestartAlert

  # ---- observability backend ----
  # ClickStack (ClickHouse + OTel gateway + HyperDX + MongoDB) is now a composition
  # (krateo-clickstack), replacing obs-stack install.sh. It also emits the ClickHouse
  # http-handlers ConfigMap, the otel-clickhouse-credentials Secret, and a HyperDX
  # LoadBalancer Service. Everything runs in namespaces.krateo (no clickhouse-system
  # split), so the collectors read the credentials Secret directly — no replica needed.
  - name: krateo-clickstack
    kind: KrateoClickstack
    version: "0.1.5"
    tier: observability
    feature: observability
  # otel-collector-* and krateo-sse-proxy live in the krateo-clickstack-chart repo
  # (grouped with the clickstack chart) and publish to the consolidated registry
  # ociRepo = oci://ghcr.io/braghettos/krateo, like every other component.
  - name: otel-collector-deployment
    kind: OtelCollectorDeployment
    version: "0.2.0"
    deps:
      - krateo-clickstack
    tier: observability
    feature: observability
  - name: otel-collector-daemonset
    kind: OtelCollectorDaemonset
    version: "0.1.1"
    deps:
      - otel-collector-deployment
    tier: observability
    feature: observability
  - name: krateo-sse-proxy
    kind: KrateoSseProxy
    version: "0.1.3"
    deps:
      - krateo-clickstack
    tier: observability
    feature: observability
    expose: true
    exposePort: 8080
    svcMatch: sse-proxy
    configKeys:
      - EVENTS_API_BASE_URL
      - EVENTS_PUSH_API_BASE_URL

  # ---- agents (kagent / kmcp-managed tools) ----
  # kagent operator is referenced upstream (pinned >= v0.6.3); see templates/_notes.
  # clickhouse-mcp-server gives the observability agent read access to telemetry; the
  # autopilot is wired for Vertex AI ADC (vertexAI: true -> compositions.yaml injects the
  # vertexAI spec block from .Values.vertexAI).
  - name: clickhouse-mcp-server
    kind: ClickhouseMcpServer
    version: "0.1.7"
    deps:
      - krateo-clickstack
    tier: observability
    feature: specialistAgents
  # kagent agentic platform as two compositions (wrapping unforked upstream charts):
  #   kagent-crds installs the kagent.dev/kmcp CRDs (helm-templates/-owned -> clean teardown);
  #   kagent (the operator) depends on it, so the CRDs are established before its CRs render.
  - name: kagent-crds
    kind: KagentCrds
    version: "0.1.2"
    tier: observability
    feature: observabilityAgents
  - name: kagent
    kind: Kagent
    version: "0.1.3"
    deps:
      - kagent-crds
    tier: observability
    feature: observabilityAgents
    # Expose the kagent UI through the installer's exposure layer (exposure.type), leaving the
    # kagent chart's ui.service default ClusterIP. kagent's Service is nested at
    # kagentapp.ui.service (not the chart top-level `service`), so serviceValuesPath targets it.
    # Safe over plain HTTP as of kagent >= 0.9.7 (PR #1868: crypto.randomUUID feature-detect +
    # uuidv4 fallback) — no TLS needed; only navigator.clipboard copy buttons degrade.
    expose: true
    exposePort: 8080
    svcMatch: kagent-ui
    serviceValuesPath: kagentapp.ui.service
  # The installer's federated specialist agent (shipped from this repo's kagent/chart/), published
  # to /krateo/krateo-installer-agent and registered on the autopilot orchestrator via
  # componentValues.krateo-autopilot.extraAgents (below). It provisions/evolves the platform by
  # editing the Installer CR — narrow RBAC, see kagent/AGENT-DRIVEN-PROVISIONING.md.
  - name: krateo-installer-agent
    kind: KrateoInstallerAgent
    version: "0.1.7"
    deps:
      - kagent
    tier: observability
    feature: observabilityAgents
    vertexAI: true
  # Federated specialist agents — each ships from its component's *-chart repo (kagent/chart),
  # registered on the autopilot via componentValues.krateo-autopilot.extraAgents.
  - name: authn-agent
    kind: KrateoAuthnAgent
    chart: krateo-authn-agent
    version: "0.1.5"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: snowplow-agent
    kind: KrateoSnowplowAgent
    chart: krateo-snowplow-agent
    version: "0.1.5"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: frontend-agent
    kind: KrateoFrontendAgent
    chart: krateo-frontend-agent
    version: "0.1.4"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: clickstack-agent
    kind: KrateoClickstackAgent
    chart: krateo-clickstack-agent
    version: "0.1.4"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: core-provider-agent
    kind: KrateoCoreProviderAgent
    chart: krateo-core-provider-agent
    version: "0.1.6"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  # Cross-cutting codegen agents (not component-tied) — shipped from braghettos/krateo-codegen-agents.
  - name: krateo-code-analysis-agent
    kind: KrateoCodeAnalysisAgent
    version: "0.1.3"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  # Answers overall-platform / general Krateo questions from a baked platform overview + read-only
  # cluster inspection. Tokenless — no github MCP, no PAT (component agents own their domain docs).
  - name: krateo-docs-agent
    kind: KrateoDocsAgent
    version: "0.1.1"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: krateo-ansible-to-operator-agent
    kind: KrateoAnsibleToOperatorAgent
    version: "0.1.3"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: krateo-tf-provider-to-operator-agent
    kind: KrateoTfProviderToOperatorAgent
    version: "0.1.3"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: krateo-tf-to-helm-agent
    kind: KrateoTfToHelmAgent
    version: "0.1.3"
    deps:
      - kagent
    tier: observability
    feature: specialistAgents
    vertexAI: true
  - name: krateo-autopilot
    kind: KrateoAutopilot
    version: "0.1.22"
    deps:
      - kagent
      - krateo-installer-agent
    tier: observability
    feature: observabilityAgents
    vertexAI: true
    # The autopilot owns the shared gemini-flash/gemini-pro ModelConfigs the whole fleet
    # references; with localModel.enabled it renders them as Ollama (the others just point here).
    modelOwner: true
