# Publishes the installer umbrella chart AND its federated agent (kagent/chart/
# krateo-installer-agent) to the consolidated registry oci://ghcr.io/braghettos/krateo on a
# semver tag push. The umbrella tracks the tag (CHART_VERSION); the agent is pinned literally
# in its own Chart.yaml (it versions independently of the umbrella).
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  OCI_REPO: oci://ghcr.io/braghettos/krateo

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Substitute version placeholder (umbrella only)
        run: sed -i "s/CHART_VERSION/${GITHUB_REF_NAME}/g" chart/Chart.yaml

      - name: Helm setup
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package & push the umbrella chart
        run: |
          helm dependency build chart || true
          helm package chart -d dist/
          helm push dist/installer-*.tgz "${OCI_REPO}"

      - name: Package & push the federated agent chart (krateo-installer-agent)
        run: |
          # Stamp the released version + pin sources so the agent tracks and READS this exact
          # release (its chart `version` stays its own pinned 0.1.0 stream — the installer pins
          # that). appVersion := the tag; SOURCE_REF in `sources` := the tag, so the agent's
          # github-MCP discovery reads the released snapshot, not a moving branch.
          sed -i "s/^appVersion:.*/appVersion: \"${GITHUB_REF_NAME}\"/" kagent/chart/Chart.yaml
          sed -i "s/SOURCE_REF/${GITHUB_REF_NAME}/g" kagent/chart/Chart.yaml
          helm package kagent/chart -d dist-agent/
          helm push dist-agent/*.tgz "${OCI_REPO}"
