bootstrap:
  coreProvider:
    enabled: true
componentValues:
  frontend:
    config:
      PROVENANCE_ENABLED: "true"
  snowplow:
    env:
      PHASE1_TIMEOUT_SECONDS: "900"
      RESOLVED_CACHE_REFRESHER_PARALLELISM: "8"
exposure:
  type: LoadBalancer
krateo-core-provider:
  # 2026-07-14 TEMPORARY: pin the engine image back to 2.7.0 — 2.7.1 carries a crdgen
  # regression (plumbing 1.10.5 nested-default markers emit malformed +kubebuilder:default,
  # `extra arguments provided: "}}}"`) that fails CRD generation for any composition schema
  # with nested object defaults (installer, frontend). REMOVE when 0.53.10 ships the fix.
  image:
    tag: "2.7.0"
  otel:
    enabled: true
    endpoint: http://otel-agent-otlp.krateo-system.svc:4318
  resources:
    limits:
      memory: 4Gi
